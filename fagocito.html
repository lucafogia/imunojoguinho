<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}

      :root{--ac:#CC55FF;}

    #ovl{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(4,7,13,.86);backdrop-filter:blur(5px);padding:12px;overflow-y:auto;font-family:'Orbitron',ui-monospace,Menlo,monospace;color:#eaf6ff;touch-action:pan-y;}

    #ovl .card{width:min(92vw,440px);max-height:94vh;overflow-y:auto;padding:22px 20px;text-align:center;background:linear-gradient(180deg,#0a1122,#070b18);clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);box-shadow:0 0 0 1px #1b2a4d,0 0 34px rgba(0,0,0,.6);}

    #ovl h2{margin:0 0 10px;font-size:17px;font-weight:900;letter-spacing:.08em;color:#fff;text-shadow:0 0 12px var(--ac);text-wrap:balance;}

    #ovl .lk{display:block;font-family:'Orbitron',ui-monospace,monospace;font-size:9px;letter-spacing:.18em;margin-bottom:2px;}
    #ovl .btn{display:block;width:100%;margin-top:12px;padding:13px 10px;border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:12px;letter-spacing:.14em;color:#04070d;background:linear-gradient(90deg,var(--ac),#fff 170%);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);box-shadow:0 0 18px color-mix(in srgb,var(--ac) 55%,transparent);text-decoration:none;box-sizing:border-box;}
    #ovl .btn.ghost{background:transparent;color:#9fb4d8;box-shadow:inset 0 0 0 1px #26365c;font-size:11px;padding:11px;}
    #ovl .btn.small{font-size:9px;padding:9px;margin-top:8px;}
    #ovl .btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px;}
    #ovl .btn:hover{filter:brightness(1.1);}
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ovl" class="hide" role="dialog" aria-modal="true" aria-label="Pausa"><div class="card" id="card"></div></div>
<script>
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
const GW=800, GH=450;
canvas.width=GW; canvas.height=GH;
function resizeCanvas(){
  const ar=GW/GH,vw=window.innerWidth,vh=window.innerHeight;
  let w,h;
  if(vw/vh>ar){h=vh;w=h*ar;}else{w=vw;h=w/ar;}
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  canvas.style.margin=((vh-h)/2)+'px auto 0';
}
window.addEventListener('resize',resizeCanvas);resizeCanvas();

const WORLD_W=1600, WORLD_H=1100;
const CELL_SIZE=65;
const FPS=60, FT=1000/FPS;
let lastTS=0, accum=0;

// Audio
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function snd(f,d,t='square',v=0.07){if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d);}catch(e){}}
function sndEat(){snd(300,0.1,'sine',0.08);setTimeout(()=>snd(450,0.12,'sine',0.06),60);setTimeout(()=>snd(600,0.08,'sine',0.05),120);}
function sndBite(){snd(200,0.08,'triangle',0.07);snd(150,0.1,'square',0.04);}
function sndHurt(){snd(80,0.3,'sawtooth',0.09);}
function sndNewType(){snd(523,0.12,'sine',0.08);setTimeout(()=>snd(659,0.12,'sine',0.07),100);setTimeout(()=>snd(784,0.15,'sine',0.07),200);}
function sndDie(){snd(300,0.3,'square',0.08);setTimeout(()=>snd(200,0.3,'square',0.08),200);setTimeout(()=>snd(100,0.5,'sawtooth',0.1),400);}
function sndPower(){snd(523,0.15,'sine',0.1);setTimeout(()=>snd(659,0.15,'sine',0.09),120);setTimeout(()=>snd(784,0.15,'sine',0.09),240);setTimeout(()=>snd(1047,0.25,'sine',0.1),360);}
function sndHazardWarn(){snd(120,0.4,'sawtooth',0.1);setTimeout(()=>snd(100,0.4,'sawtooth',0.1),300);}
function sndHazardHit(){snd(60,0.4,'sawtooth',0.12);snd(90,0.3,'square',0.08);}
function sndRepair(){snd(400,0.1,'sine',0.06);setTimeout(()=>snd(500,0.1,'sine',0.05),80);setTimeout(()=>snd(600,0.08,'sine',0.04),160);}
function sndWin(){snd(523,0.12,'sine',0.09);setTimeout(()=>snd(659,0.12,'sine',0.08),110);setTimeout(()=>snd(784,0.12,'sine',0.08),220);setTimeout(()=>snd(1047,0.25,'sine',0.09),330);}
function sndKillHazard(){snd(700,0.08,'square',0.06);setTimeout(()=>snd(900,0.1,'sine',0.06),60);setTimeout(()=>snd(1200,0.12,'sine',0.05),120);}

// ===== Kit de polimento: fontes, áudio suave, efeitos (sobrescreve initAudio/snd acima) =====
const FONT='Fredoka, "Segoe UI", Arial, sans-serif', MONO='"Rubik Mono One", "Courier New", monospace';
if(document.fonts){document.fonts.load('700 32px Fredoka');document.fonts.load('400 20px "Rubik Mono One"');}
let muted=localStorage.getItem('imuno_mute')==='1';
let masterGain=null;
function initAudio(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const comp=audioCtx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;
    masterGain=audioCtx.createGain();masterGain.gain.value=muted?0:0.7;masterGain.connect(comp);comp.connect(audioCtx.destination);}catch(e){return;}}
  if(audioCtx.state==='suspended')audioCtx.resume();
}
function toggleMute(){muted=!muted;localStorage.setItem('imuno_mute',muted?'1':'0');if(masterGain)masterGain.gain.value=muted?0:0.7;}
function tone(f,d,o={}){
  if(!audioCtx||!masterGain)return;
  try{const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),g=audioCtx.createGain(),lp=audioCtx.createBiquadFilter();
    osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);if(o.slide)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+d);
    lp.type='lowpass';lp.frequency.value=o.cutoff||2400;
    const v=o.vol||0.05,a=o.attack||0.008;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0005,t+d);
    osc.connect(lp);lp.connect(g);g.connect(masterGain);osc.start(t);osc.stop(t+d+0.02);}catch(e){}
}
function chord(notes,d,o={},gap=0.07){notes.forEach((n,i)=>setTimeout(()=>tone(n,d,o),i*gap*1000));}
function noiseBurst(d,vol=0.05,cutoff=800){
  if(!audioCtx||!masterGain)return;
  try{const t=audioCtx.currentTime,len=Math.floor(audioCtx.sampleRate*d),buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
    const src=audioCtx.createBufferSource(),g=audioCtx.createGain(),lp=audioCtx.createBiquadFilter();src.buffer=buf;lp.type='lowpass';lp.frequency.value=cutoff;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0005,t+d);src.connect(lp);lp.connect(g);g.connect(masterGain);src.start(t);}catch(e){}
}
// Shim: chamadas antigas a snd() viram tons suaves (sem square/sawtooth cru)
function snd(f,d,t='sine',v=0.06){tone(f,d,{type:(t==='square'||t==='sawtooth')?'triangle':t,vol:v*0.6,cutoff:1800});}
function sndEat(){tone(520,0.13,{slide:260,vol:0.045});}
function sndBite(){tone(300,0.08,{type:'triangle',vol:0.035});}
function sndHurt(){noiseBurst(0.2,0.07,500);tone(110,0.3,{type:'triangle',slide:60,vol:0.06});}
function sndHazardHit(){noiseBurst(0.22,0.08,450);tone(100,0.35,{type:'triangle',slide:50,vol:0.065});}
function sndHazardWarn(){tone(95,0.35,{type:'triangle',vol:0.05});setTimeout(()=>tone(80,0.35,{type:'triangle',vol:0.05}),320);}
function sndNewType(){chord([659,880],0.12,{vol:0.04});}
function sndDie(){tone(300,0.5,{type:'triangle',slide:70,vol:0.06});noiseBurst(0.4,0.05,400);}
function sndPower(){chord([523,659,784,1047],0.2,{vol:0.05});}
function sndRepair(){chord([523,659],0.1,{vol:0.035});}
function sndWin(){chord([523,659,784,1047,1319],0.35,{vol:0.05},0.09);}
function sndKillHazard(){chord([880,1175,1568],0.1,{vol:0.045},0.05);}
function sndDivide(){tone(190,0.07,{type:'triangle',vol:0.018});}
function vignette(w,h,strength=0.5){const g=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*0.42,w/2,h/2,Math.max(w,h)*0.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+strength+')');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);}
const MUTE_BTN={x:GW-40,y:56,w:28,h:24};
function drawMuteBtn(){const b=MUTE_BTN;ctx.save();ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,7);ctx.fill();ctx.font='14px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillText(muted?'🔇':'🔊',b.x+b.w/2,b.y+b.h/2+1);ctx.restore();}
function muteHit(x,y){const b=MUTE_BTN;return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}
// Capilares de fundo (coordenadas de mundo)
const CAPS=Array.from({length:10},(_,i)=>({x:(i*331+120)%WORLD_W,y:(i*577+80)%WORLD_H,len:320+(i*97)%320,ang:((i*0.9)%Math.PI)-Math.PI/2,w:7+(i%3)*4,bend:(i%2?1:-1)*(60+(i*23)%60)}));

// Character configs
const CHAR_CONFIG={
  M1:{
    name:'Macrófago M1', desc:'Modo Fagocitose',
    detail:'Contenha a infecção: fagocite as bactérias antes que se multipliquem. Cresce ao comer.',
    color:'#9955CC', dark:'#7744AA', light:'#CC99EE',
    bodyColors:['#CC99EE','#9966BB','#7744AA'],
    pseudoCol:'rgba(130,70,180,0.7)',
    eyeCol:'#660066', nucleusCol:'rgba(50,20,80,0.35)',
    speed:3.0, radius:26,
    cytokine:'TNF-α', cytokineDesc:'Speed boost + raio maior',
    deathMsg:'TECIDO TOMADO!', deathDesc:'As bactérias se multiplicaram mais rápido do que o macrófago conseguia fagocitar.',
    scoreLabel:'fagocitados', grows:true,
    uiAccent:'#CC88FF', uiDark:'rgba(100,50,150,0.5)',
  },
  NEUTRO:{
    name:'Neutrófilo', desc:'Modo Ataque Rápido',
    detail:'Rápido e agressivo: o primeiro a chegar. Alcance menor, burst de IL-8 devastador.',
    color:'#4488DD', dark:'#2266AA', light:'#88BBFF',
    bodyColors:['#88BBFF','#5599DD','#3377BB'],
    pseudoCol:'rgba(60,100,200,0.7)',
    eyeCol:'#003366', nucleusCol:'rgba(20,40,80,0.35)',
    speed:3.2, radius:22,
    cytokine:'IL-8', cytokineDesc:'Burst respiratório AoE',
    deathMsg:'TECIDO TOMADO!', deathDesc:'O neutrófilo liberou NETs e formou pus, mas as bactérias tomaram o tecido.',
    scoreLabel:'fagocitados', grows:false,

  },
  M2:{

    color:'#44AA88', dark:'#228866', light:'#88DDBB',
    bodyColors:['#88DDBB','#55BB99','#339977'],

    eyeCol:'#004433', nucleusCol:'rgba(20,60,50,0.35)',
    speed:2.7, radius:26,
    cytokine:'IL-10', cytokineDesc:'Reparo 2x mais rápido e a degradação para por 10s',
    deathMsg:'TECIDO COLAPSOU!', deathDesc:'A degradação avançou mais rápido do que o reparo.',

};

// --- Modos de dificuldade (meta = sobreviver ao tempo) ---
// divide = intervalo (s) entre divisões de cada bactéria; arrive = frames entre novas chegadas; maxLoad = carga que perde
const MODES={
  FACIL:  {key:'FACIL',  label:'Fácil',  secs:60,  divide:[24,36], arrive:450, maxLoad:40, hazardEvery:700, hazardMax:1, col:'#66DD88'},
  MEDIO:  {key:'MEDIO',  label:'Médio',  secs:90,  divide:[18,28], arrive:360, maxLoad:44, hazardEvery:480, hazardMax:2, col:'#FFC24D'},
  DIFICIL:{key:'DIFICIL',label:'Difícil',secs:120, divide:[13,20], arrive:260, maxLoad:48, hazardEvery:360, hazardMax:2, col:'#FF6B6B'},
};
function rnd(r){return r[0]+Math.random()*(r[1]-r[0]);}
// carga atual de infecção (M1/neutrófilo) ou degradação (M2)
function currentLoad(){
  if(charType==='M2') return targets.reduce((a,t)=>a+(t.repairing?0:t.cfg.load),0);
  return bacteria.reduce((a,b)=>a+(b.eating?0:b.cfg.load),0);
}
const modeKeys=['FACIL','MEDIO','DIFICIL'];

// State
let state='menu';
let charType='M1';
let frame=0, gameOverTime=0;
let mode='MEDIO', targetFrames=5400, elapsed=0;
let factToast=null;   // {text,life} — curiosidade legível durante o jogo
let mouseX=0, mouseY=0;
let hazardSpawnCount=0, overT=0;
let highScore=parseInt(localStorage.getItem('fagocito_hs')||'0');
let selectHover=-1; // which card is hovered in select screen

// Player
let P={};
let camX=0, camY=0;
let targetX=WORLD_W/2, targetY=WORLD_H/2;
let touching=false;
let shakeX=0, shakeY=0, shakeTime=0;

// Game arrays
let bacteria=[];
let targets=[]; // M2 repair targets
let hazards=[]; // protozoan enemies
let particles=[];
let texts=[];
let phagosomes=[];
let alerts=[];

// Bacteria types
const TYPES={
  COCCUS:    {name:'Coccus (Staphylococcus)',  short:'Coccus',   col:'#55CC55',dk:'#338833',r:8, spd:0.7, flee:60,  fforce:0.3,pts:1, hp:5,  load:1,   shape:'circle'},
  BACILLUS:  {name:'Bacilo (Escherichia coli)', short:'Bacilo',   col:'#4499DD',dk:'#336699',r:6, spd:1.2, flee:120, fforce:0.6,pts:2, hp:8,  load:1.5, shape:'rod'},
  SPIRILLUM: {name:'Espiroqueta (Treponema)',   short:'Espiroqueta',col:'#EE5544',dk:'#AA3322',r:5, spd:2.2, flee:180, fforce:0.9,pts:4, hp:3,  load:1.5, shape:'spiral'},
  CAPSULADO: {name:'Pneumococo (encapsulado)',  short:'Capsulado',col:'#FFAA33',dk:'#BB7711',r:10,spd:0.5, flee:40,  fforce:0.2,pts:6, hp:18, load:2.5, shape:'capsule', hits:3},
};

// M2 target types
const TARGET_TYPES={
  DETRITO:   {name:'Detrito Celular',   short:'Detrito',  col:'#888888',dk:'#555555',r:10,spd:0,   pts:1,hits:1,load:1,  shape:'debris'},
  NECROSE:   {name:'Tecido Necrótico',  short:'Necrose',  col:'#884433',dk:'#552211',r:14,spd:0,   pts:3,hits:2,load:2,  shape:'necrotic'},
  APOPTOSE:  {name:'Célula Apoptótica', short:'Apoptótica',col:'#DD8833',dk:'#AA6611',r:11,spd:0.3,pts:2,hits:1,load:1.5,shape:'apoptotic'},
  FIBROSE:   {name:'Fibrose',           short:'Fibrose',  col:'#CCAA44',dk:'#997722',r:16,spd:0,   pts:5,hits:3,load:3,  shape:'fibrosis'},
};

// Milestone intro messages
const introMsgs={
  BACILLUS: 'NOVO: Bacilos! Fogem de você e pesam mais na infecção.',
  SPIRILLUM:'NOVO: Espiroquetas! Rápidas e evasivas.',
  CAPSULADO:'NOVO: Pneumococos! Cápsula protege da fagocitose. Precisa 2 contatos!',
};
const introMsgsM2={
  NECROSE:  'NOVO: Tecido Necrótico! Precisa 2 toques — e se espalha se você demorar.',
  APOPTOSE: 'NOVO: Células Apoptóticas! Elas se movem devagar.',
  FIBROSE:  'NOVO: Fibrose! Grande, precisa 3 toques e vale 5 pontos!',
};
let introduced={};

// Facts per character
const factsM1=[
  "A fagocitose começa com o reconhecimento do patógeno via receptores PRR (como TLRs).",
  "Pseudópodes são extensões do citoplasma que envolvem o patógeno durante a fagocitose.",

const factsNeutro=[
  "Neutrófilos são os leucócitos mais abundantes no sangue, representando 60-70% dos glóbulos brancos.",

function getFacts(){
  if(charType==='NEUTRO') return factsNeutro;
  if(charType==='M2') return factsM2;
  return factsM1;
}

function init(){
  frame=0; elapsed=0; factToast=null; hazardSpawnCount=0; overT=0;
  targetFrames=MODES[mode].secs*60;
  const cfg=CHAR_CONFIG[charType];
  P={x:WORLD_W/2,y:WORLD_H/2,r:cfg.radius,baseR:cfg.radius,spd:cfg.speed,
     hp:100,maxHp:100,stun:0,
     eaten:0,pseudo:0,moveAngle:0,moving:false,
     power:0,powerName:'',
     knockX:0,knockY:0,damageFlash:0,
     lastPowerMilestone:0};
  targetX=P.x; targetY=P.y; touching=false;
  shakeX=0;shakeY=0;shakeTime=0;
  bacteria=[]; targets=[]; hazards=[];
  particles=[]; texts=[]; phagosomes=[]; alerts=[];

  if(charType==='M2'){
    introduced={DETRITO:true,NECROSE:false,APOPTOSE:false,FIBROSE:false};
    for(let i=0;i<10;i++) spawnTarget('DETRITO');
  } else {
    introduced={COCCUS:true,BACILLUS:false,SPIRILLUM:false,CAPSULADO:false};
    for(let i=0;i<10;i++) spawnBact('COCCUS');
  }
}

function spawnBact(type){
  const t=TYPES[type];
  let x,y,tries=0;
  do {
    x=t.r+Math.random()*(WORLD_W-t.r*2);
    y=t.r+Math.random()*(WORLD_H-t.r*2);
    tries++;
  } while(tries<20 && dist(x,y,P.x,P.y)<150);
  bacteria.push({
    x,y,type,cfg:t,
    vx:(Math.random()-0.5)*t.spd,
    vy:(Math.random()-0.5)*t.spd,
    r:t.r, hp:1,
    capsule: type==='CAPSULADO'?2:0,
    divT: rnd(MODES[mode].divide)*60,
    wobble:Math.random()*Math.PI*2,
    eating:false, eatTimer:0,
    flash:0,
  });
}

function spawnTarget(type){
  const t=TARGET_TYPES[type];
  let x,y,tries=0;
  do {
    x=t.r+Math.random()*(WORLD_W-t.r*2);
    y=t.r+Math.random()*(WORLD_H-t.r*2);
    tries++;
  } while(tries<20 && dist(x,y,P.x,P.y)<150);
  targets.push({
    x,y,type,cfg:t,
    vx: t.spd>0?(Math.random()-0.5)*t.spd:0,
    vy: t.spd>0?(Math.random()-0.5)*t.spd:0,
    r:t.r, hp:1,
    divT: rnd(MODES[mode].divide)*60*1.4,
    hitsLeft:t.hits,
    wobble:Math.random()*Math.PI*2,
    repairing:false, repairTimer:0,
    flash:0, angle:Math.random()*Math.PI*2,
  });
}

function spawnHazard(type){
  const edge=Math.floor(Math.random()*4);
  let x,y;
  if(edge===0){x=Math.random()*WORLD_W;y=-20;}
  else if(edge===1){x=WORLD_W+20;y=Math.random()*WORLD_H;}
  else if(edge===2){x=Math.random()*WORLD_W;y=WORLD_H+20;}
  else{x=-20;y=Math.random()*WORLD_H;}

  const spd=type==='TOXO'?1.8:2.3;
  const r=type==='TOXO'?12:8;
  const dmg=type==='TOXO'?40:30;
  const name=type==='TOXO'?'Toxoplasma gondii':'Leishmania';
  const col=type==='TOXO'?'#BB9933':'#336633';
  const dk=type==='TOXO'?'#886622':'#224422';

  hazards.push({
    x,y,type,name,col,dk,r,spd,dmg,
    life:1800, // 30 seconds
    wobble:Math.random()*Math.PI*2,
    trail:[],
  });
  addAlert('PERIGO: '+name+' detectado!','#FF4444');
  sndHazardWarn();
}

function dist(x1,y1,x2,y2){return Math.sqrt((x2-x1)**2+(y2-y1)**2);}
function divideBact(b){ // fissão binária: nasce uma irmã ao lado
  const a=Math.random()*Math.PI*2;
  const n={x:b.x+Math.cos(a)*b.r*2.2,y:b.y+Math.sin(a)*b.r*2.2,type:b.type,cfg:b.cfg,
    vx:Math.cos(a)*b.cfg.spd,vy:Math.sin(a)*b.cfg.spd,r:b.cfg.r,hp:1,capsule:b.type==='CAPSULADO'?2:0,
    divT:rnd(MODES[mode].divide)*60,wobble:Math.random()*Math.PI*2,eating:false,eatTimer:0,flash:0};
  n.x=Math.max(n.r,Math.min(WORLD_W-n.r,n.x));n.y=Math.max(n.r,Math.min(WORLD_H-n.r,n.y));
  bacteria.push(n);addP(b.x,b.y,b.cfg.col,6,2);addText(b.x,b.y-b.r-8,'×2','#FF8888',11);sndDivide();
}
function spreadTarget(t){ // necrose se espalha para o tecido vizinho
  const a=Math.random()*Math.PI*2;
  const n={x:t.x+Math.cos(a)*t.r*2.4,y:t.y+Math.sin(a)*t.r*2.4,type:'NECROSE',cfg:TARGET_TYPES.NECROSE,vx:0,vy:0,r:TARGET_TYPES.NECROSE.r,hp:1,
    divT:rnd(MODES[mode].divide)*60*1.4,hitsLeft:2,wobble:Math.random()*Math.PI*2,repairing:false,repairTimer:0,flash:0,angle:Math.random()*Math.PI*2};
  n.x=Math.max(n.r,Math.min(WORLD_W-n.r,n.x));n.y=Math.max(n.r,Math.min(WORLD_H-n.r,n.y));
  targets.push(n);addP(t.x,t.y,'#884433',6,2);addText(t.x,t.y-t.r-8,'espalhou','#FF8888',10);sndDivide();
}
function surge(){ // protozoário derruba a defesa: a infecção/degradação dá um salto perto de você
  if(charType==='M2'){for(let i=0;i<2;i++){if(currentLoad()+2>MODES[mode].maxLoad-3)break;const a=Math.random()*Math.PI*2;spreadTarget({x:P.x+Math.cos(a)*60,y:P.y+Math.sin(a)*60,r:14});}return;}
  const e=P.eaten;const pool=e>=30?['COCCUS','BACILLUS','SPIRILLUM','CAPSULADO']:e>=15?['COCCUS','BACILLUS','SPIRILLUM']:e>=5?['COCCUS','BACILLUS']:['COCCUS'];
  for(let i=0;i<2;i++){const type=pool[Math.floor(Math.random()*pool.length)];const a=Math.random()*Math.PI*2;
    if(currentLoad()+TYPES[type].load>MODES[mode].maxLoad-3)break; // o surto assusta, mas não mata sozinho
    divideBact({x:P.x+Math.cos(a)*70,y:P.y+Math.sin(a)*70,type,cfg:TYPES[type],r:TYPES[type].r});}
}

function addP(x,y,col,n=6,sp=4){
  for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-0.5)*sp,vy:(Math.random()-0.5)*sp,
    life:1,decay:0.02+Math.random()*0.02,r:2+Math.random()*3,col});
}
function addText(x,y,txt,col='#FFF',sz=13){texts.push({x,y,txt,col,sz,life:1,vy:-1});}
function addAlert(msg,col='#FFDD44'){alerts.push({msg,col,life:1,y:GH*0.2});}
function showFact(text){factToast={text,life:1};}
function winGame(){
  state='won'; gameOverTime=Date.now();
  if(P.eaten>highScore){highScore=P.eaten;localStorage.setItem('fagocito_hs',highScore+'');}
  sndWin();
}
function modeButtonRects(){
  const bw=200,bh=76,gap=22,total=3*bw+2*gap,x0=(GW-total)/2,y=GH*0.60;
  return modeKeys.map((k,i)=>({key:k,x:x0+i*(bw+gap),y,w:bw,h:bh}));
}
function pickMode(x,y){for(const r of modeButtonRects()){if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){mode=r.key;startGame();return true;}}return false;}
// Botão "voltar ao hub" (canto superior esquerdo nas telas fora do jogo)

function goHome(){location.href='index.html';}

// --- POWER SYSTEM ---
function activatePower(){
  const cfg=CHAR_CONFIG[charType];
  P.power=600; // 10 seconds
  P.powerName=cfg.cytokine;
  addAlert('PODER DESBLOQUEADO! '+cfg.cytokine+'!','#FFD700');
  sndPower();
}

// --- UPDATE ---
function update(){
  if(state!=='playing') return;
  frame++; elapsed++;

  // Screen shake
  if(shakeTime>0){
    shakeTime--;
    shakeX=(Math.random()-0.5)*shakeTime*0.5;
    shakeY=(Math.random()-0.5)*shakeTime*0.5;
  } else { shakeX=0;shakeY=0; }

  // Damage flash
  if(P.damageFlash>0) P.damageFlash--;

  // Knockback decay
  P.knockX*=0.85; P.knockY*=0.85;

  // Player movement (parado enquanto atordoado por protozoário)
  if(P.stun>0)P.stun--;
  if(P.stun<=0&&(touching||(!('ontouchstart' in window)))){
    const dx=targetX-P.x, dy=targetY-P.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    let spd=P.spd;
    // Power speed boost for M1
    if(charType==='M1' && P.power>0) spd*=1.4;
    if(d>3){
      P.x+=dx/d*spd+P.knockX; P.y+=dy/d*spd+P.knockY;
      P.moveAngle=Math.atan2(dy,dx);
      P.moving=true;
    } else {
      P.x+=P.knockX; P.y+=P.knockY;
      P.moving=false;
    }
  } else {
    P.x+=P.knockX; P.y+=P.knockY;
    P.moving=false;
  }

  // Clamp to world
  P.x=Math.max(P.r,Math.min(WORLD_W-P.r,P.x));
  P.y=Math.max(P.r,Math.min(WORLD_H-P.r,P.y));

  P.pseudo+=0.06;

  const cfg=CHAR_CONFIG[charType];

  // Growth (only M1)
  if(cfg.grows){
    P.r=cfg.radius+Math.min(14,P.eaten*0.25);
    P.spd=Math.max(2.4, cfg.speed-P.eaten*0.006); // cresce e desacelera um pouco, mas nunca vira alvo parado
  } else {
    P.r=cfg.radius;
    P.spd=cfg.speed;
  }
  // Power radius boost for M1
  if(charType==='M1' && P.power>0) P.r*=1.3;
  // Power radius boost for M2
  if(charType==='M2' && P.power>0) P.r*=1.5;

  // (sem drenagem de energia: a pressão vem da carga de infecção/degradação, que sobe sozinha)

  // Power countdown
  if(P.power>0){
    P.power--;
    // Neutro IL-8 AoE burst
    if(charType==='NEUTRO' && frame%10===0){
      const aoR=120;
      for(const b of bacteria){
        if(b.eating) continue;
        const d2=dist(b.x,b.y,P.x,P.y);
        if(d2<aoR){
          b.hp=0;
          P.eaten++;
          addP(b.x,b.y,b.cfg.col,8,4);
          addText(b.x,b.y-10,'+'+b.cfg.pts,'#66AAFF',12);
          sndEat();
        }
      }
      bacteria=bacteria.filter(b=>b.hp>0);
      // Shockwave particles
      for(let a=0;a<Math.PI*2;a+=0.3){
        particles.push({x:P.x+Math.cos(a)*aoR*0.5,y:P.y+Math.sin(a)*aoR*0.5,
          vx:Math.cos(a)*2,vy:Math.sin(a)*2,life:0.5,decay:0.05,r:3,col:'rgba(100,170,255,0.6)'});
      }
    }
    // M2 IL-10 healing particles
    if(charType==='M2' && frame%8===0){
      const a=Math.random()*Math.PI*2;
      particles.push({x:P.x+Math.cos(a)*P.r,y:P.y+Math.sin(a)*P.r,
        vx:Math.cos(a)*-1,vy:Math.sin(a)*-1,life:0.8,decay:0.04,r:3,col:'#66FFAA'});
    }
  }

  if(currentLoad()>=MODES[mode].maxLoad){ overT++; if(overT%20===1) addText(P.x,P.y-P.r-24,(charType==='M2'?'DEGRADAÇÃO':'INFECÇÃO')+' CRÍTICA!','#FF4444',15); } else overT=0;
  if(overT>=90){
    state='gameover'; gameOverTime=Date.now();
    if(P.eaten>highScore){highScore=P.eaten;localStorage.setItem('fagocito_hs',highScore+'');}
    sndDie(); return;
  }
  // Vitória: sobreviveu ao tempo todo
  if(elapsed>=targetFrames){ winGame(); return; }

  // --- M2 target logic ---
  if(charType==='M2'){
    updateM2Targets();
  } else {
    updateBacteria();
  }

  // --- Hazards (protozoa) ---
  updateHazards();

  // Phagosomes inside player
  for(let i=phagosomes.length-1;i>=0;i--){
    phagosomes[i].life--; phagosomes[i].r*=0.99;
    if(phagosomes[i].life<=0) phagosomes.splice(i,1);
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx;p.y+=p.vy;p.vx*=0.96;p.vy*=0.96;p.life-=p.decay;
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=texts.length-1;i>=0;i--){
    texts[i].y+=texts[i].vy; texts[i].life-=0.012;
    if(texts[i].life<=0) texts.splice(i,1);
  }
  for(let i=alerts.length-1;i>=0;i--){
    alerts[i].life-=0.004;
    if(alerts[i].life<=0) alerts.splice(i,1);
  }
  if(factToast){ factToast.life-=0.0032; if(factToast.life<=0) factToast=null; }

  // Camera
  camX+=(P.x-GW/2-camX)*0.08;
  camY+=(P.y-GH/2-camY)*0.08;
  camX=Math.max(0,Math.min(WORLD_W-GW,camX));
  camY=Math.max(0,Math.min(WORLD_H-GH,camY));
}

function updateBacteria(){
  const e=P.eaten;const M=MODES[mode];
  if(frame%M.arrive===0 && currentLoad()<M.maxLoad-1){ // novas bactérias chegam ao tecido
    let type='COCCUS';
    if(e>=30) type=['COCCUS','BACILLUS','SPIRILLUM','CAPSULADO'][Math.floor(Math.random()*4)];
    else if(e>=15) type=['COCCUS','BACILLUS','SPIRILLUM'][Math.floor(Math.random()*3)];
    else if(e>=5) type=['COCCUS','BACILLUS'][Math.floor(Math.random()*2)];
    if(!introduced[type]&&introMsgs[type]){introduced[type]=true;addAlert(introMsgs[type]);sndNewType();}
    spawnBact(type);
  }

  for(const b of bacteria){
    if(b.eating){
      b.eatTimer++;
      b.x+=(P.x-b.x)*0.12; b.y+=(P.y-b.y)*0.12;
      b.r=b.cfg.r*(1-b.eatTimer/30*0.8);
      if(b.eatTimer>=30){
        b.hp=0;
        P.eaten++;
        addP(P.x,P.y,b.cfg.col,10,3);
        addText(b.x,b.y-15,'+'+b.cfg.pts,b.cfg.col,14);
        phagosomes.push({ox:(Math.random()-0.5)*P.r*0.5,oy:(Math.random()-0.5)*P.r*0.5,
          r:4,life:90,col:b.cfg.col});
        sndEat();
        checkPowerMilestone();
        const facts=getFacts();
        if(P.eaten%10===0 && P.eaten>0) showFact(facts[P.eaten/10%facts.length|0]);
      }
      continue;
    }

    b.wobble+=0.08;
    b.divT--;if(b.divT<=0){b.divT=rnd(M.divide)*60;if(currentLoad()+b.cfg.load<=M.maxLoad)divideBact(b);}
    const d2=dist(b.x,b.y,P.x,P.y);
    if(b.cfg.flee>0 && d2<b.cfg.flee){
      const ax=(b.x-P.x)/d2*b.cfg.fforce;
      const ay=(b.y-P.y)/d2*b.cfg.fforce;
      b.vx+=ax; b.vy+=ay;
    }
    if(frame%60===0 && Math.random()<0.3){
      b.vx+=(Math.random()-0.5)*0.5;
      b.vy+=(Math.random()-0.5)*0.5;
    }
    const spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
    if(spd>b.cfg.spd){b.vx*=b.cfg.spd/spd; b.vy*=b.cfg.spd/spd;}
    b.x+=b.vx; b.y+=b.vy;
    if(b.x<b.r){b.x=b.r;b.vx*=-1;}
    if(b.x>WORLD_W-b.r){b.x=WORLD_W-b.r;b.vx*=-1;}
    if(b.y<b.r){b.y=b.r;b.vy*=-1;}
    if(b.y>WORLD_H-b.r){b.y=WORLD_H-b.r;b.vy*=-1;}
    if(b.flash>0) b.flash--;

    if(d2 < P.r+b.r*0.3){
      if(b.capsule>1){
        if(b.flash<=0){
          b.capsule=1; b.flash=20;
          addP(b.x,b.y,'#FFDD88',8,5);
          addText(b.x,b.y-15,'CÁPSULA REMOVIDA!','#FFAA33',11);
          sndBite();
          b.vx=(b.x-P.x)/d2*2; b.vy=(b.y-P.y)/d2*2;
        }
      } else {
        b.eating=true; b.eatTimer=0;
      }
    }
  }
  bacteria=bacteria.filter(b=>b.hp>0);
}

function updateM2Targets(){
  const e=P.eaten;const M=MODES[mode];
  if(P.power<=0 && frame%M.arrive===0 && currentLoad()<M.maxLoad-1){ // o tecido segue se degradando (IL-10 pausa)
    let type='DETRITO';
    if(e>=25) type=['DETRITO','NECROSE','APOPTOSE','FIBROSE'][Math.floor(Math.random()*4)];
    else if(e>=12) type=['DETRITO','NECROSE','APOPTOSE'][Math.floor(Math.random()*3)];
    else if(e>=5) type=['DETRITO','NECROSE'][Math.floor(Math.random()*2)];
    if(!introduced[type]&&introMsgsM2[type]){introduced[type]=true;addAlert(introMsgsM2[type]);sndNewType();}
    spawnTarget(type);
  }

  for(const t of targets){
    if(t.repairing){
      t.repairTimer+=(P.power>0?2:1); // IL-10: reparo 2x
      t.r=t.cfg.r*(1-Math.min(1,t.repairTimer/40)*0.8);
      // Green healing particles
      if(t.repairTimer%5===0) addP(t.x,t.y,'#66FF88',4,2);
      if(t.repairTimer>=40){
        t.hp=0;
        P.eaten++;
        addP(t.x,t.y,'#66FF88',12,4);
        addText(t.x,t.y-15,'+'+t.cfg.pts,'#66FFAA',14);
        sndRepair();
        checkPowerMilestone();
        const facts=getFacts();
        if(P.eaten%10===0 && P.eaten>0) showFact(facts[P.eaten/10%facts.length|0]);
      }
      continue;
    }

    t.wobble+=0.04;
    if(t.type==='NECROSE'&&P.power<=0){t.divT--;if(t.divT<=0){t.divT=rnd(M.divide)*60*1.4;if(currentLoad()+t.cfg.load<=M.maxLoad)spreadTarget(t);}}
    // Move (only apoptotic)
    if(t.cfg.spd>0){
      t.x+=t.vx; t.y+=t.vy;
      if(frame%120===0){t.vx=(Math.random()-0.5)*t.cfg.spd;t.vy=(Math.random()-0.5)*t.cfg.spd;}
      if(t.x<t.r){t.x=t.r;t.vx*=-1;}
      if(t.x>WORLD_W-t.r){t.x=WORLD_W-t.r;t.vx*=-1;}
      if(t.y<t.r){t.y=t.r;t.vy*=-1;}
      if(t.y>WORLD_H-t.r){t.y=WORLD_H-t.r;t.vy*=-1;}
    }
    if(t.flash>0) t.flash--;

    const d2=dist(t.x,t.y,P.x,P.y);
    let repairR=P.r+t.r*0.3;
    if(d2<repairR){
      if(t.hitsLeft>1){
        if(t.flash<=0){
          t.hitsLeft--;
          t.flash=20;
          addP(t.x,t.y,'#66FF88',6,3);
          addText(t.x,t.y-15,'REPARANDO... ('+t.hitsLeft+')','#66FFAA',10);
          sndBite();
        }
      } else {
        t.repairing=true; t.repairTimer=0;
      }
    }
  }
  targets=targets.filter(t=>t.hp>0);
}

function updateHazards(){
  // Protozoários chegam em intervalos fixos por modo, após um período de graça
  const M=MODES[mode];
  if(elapsed>=600 && (elapsed-600)%M.hazardEvery===0 && hazards.length<M.hazardMax){
    spawnHazard(hazardSpawnCount%2===0?'TOXO':'LEISH'); hazardSpawnCount++;
  }

  for(let i=hazards.length-1;i>=0;i--){
    const h=hazards[i];
    h.life--;
    h.wobble+=0.1;

    // Persegue o jogador — mas sempre um pouco mais lento que ele (dá pra fugir)
    const dx=P.x-h.x, dy=P.y-h.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    const pSpd=P.spd*((charType==='M1'&&P.power>0)?1.4:1);
    const chase=Math.min(h.spd, pSpd*0.85);
    if(d>1){
      h.x+=dx/d*chase;
      h.y+=dy/d*chase;
    }

    // Trail
    if(frame%3===0){
      h.trail.push({x:h.x,y:h.y,life:1});
    }
    for(let j=h.trail.length-1;j>=0;j--){
      h.trail[j].life-=0.04;
      if(h.trail[j].life<=0) h.trail.splice(j,1);
    }

    // Contato: parasita intracelular. Célula ATIVADA (M1 c/ TNF-α, neutrófilo em burst) destrói;
    // caso contrário ele infecta a célula e drena energia. (M2 é permissivo — não mata.)
    if(d<P.r+h.r){
      const activated = P.power>0 && charType!=='M2';
      if(activated){
        P.eaten+=2;
        addP(h.x,h.y,'#FFDD55',18,6);
        addText(h.x,h.y-h.r-10,h.name+' DESTRUÍDO! +2','#FFDD55',13);
        sndKillHazard();
        hazards.splice(i,1);
        continue;
      }
      P.damageFlash=15;
      shakeTime=12;P.stun=55;
      const kf=9;
      P.knockX=-(dx/d)*kf;
      P.knockY=-(dy/d)*kf;
      surge();
      addP(P.x,P.y,'#FF4444',15,6);
      addText(P.x,P.y-P.r-10,'INFECTADO! a '+(charType==='M2'?'degradação':'infecção')+' avança','#FF4444',14);
      sndHazardHit();
      hazards.splice(i,1);
      continue;
    }

    // Remove if expired or out of bounds far
    if(h.life<=0){
      hazards.splice(i,1);
    }
  }
}

function checkPowerMilestone(){
  if(P.eaten>0 && P.eaten%10===0 && P.eaten!==P.lastPowerMilestone){
    P.lastPowerMilestone=P.eaten;
    activatePower();
  }
}

// --- DRAW ---
function drawBG(){
  const bgG=ctx.createLinearGradient(0,0,GW,GH);bgG.addColorStop(0,'#FFE3E8');bgG.addColorStop(0.5,'#FFD6DD');bgG.addColorStop(1,'#F9C7D1');
  ctx.fillStyle=bgG;ctx.fillRect(0,0,GW,GH);
  // Capilares com hemácias
  for(const c of CAPS){
    const sx=c.x-camX, sy=c.y-camY, ex=sx+Math.cos(c.ang)*c.len, ey=sy+Math.sin(c.ang)*c.len;
    if(Math.max(sx,ex)<-50||Math.min(sx,ex)>GW+50||Math.max(sy,ey)<-50||Math.min(sy,ey)>GH+50) continue;
    const mx=(sx+ex)/2+Math.cos(c.ang+Math.PI/2)*c.bend, my=(sy+ey)/2+Math.sin(c.ang+Math.PI/2)*c.bend;
    ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(mx,my,ex,ey);ctx.strokeStyle='rgba(225,90,115,0.13)';ctx.lineWidth=c.w;ctx.stroke();
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.quadraticCurveTo(mx,my,ex,ey);ctx.strokeStyle='rgba(255,160,175,0.10)';ctx.lineWidth=c.w*0.4;ctx.stroke();
    for(let h=0;h<3;h++){const t=((frame*0.004+h*0.33+c.x*0.001)%1);const hx=(1-t)*(1-t)*sx+2*(1-t)*t*mx+t*t*ex, hy=(1-t)*(1-t)*sy+2*(1-t)*t*my+t*t*ey;
      ctx.beginPath();ctx.ellipse(hx,hy,3.2,1.8,c.ang,0,Math.PI*2);ctx.fillStyle='rgba(215,60,80,0.35)';ctx.fill();}
  }
  ctx.strokeStyle='rgba(190,110,130,0.12)';
  ctx.lineWidth=1;
  const oX=-(camX%CELL_SIZE)-CELL_SIZE;
  const oY=-(camY%CELL_SIZE)-CELL_SIZE;
  for(let x=oX;x<GW+CELL_SIZE*2;x+=CELL_SIZE){
    for(let y=oY;y<GH+CELL_SIZE*2;y+=CELL_SIZE){
      const row=Math.floor((y+camY)/CELL_SIZE);
      const off=(row%2)*CELL_SIZE*0.5;
      ctx.beginPath();ctx.arc(x+off,y,CELL_SIZE*0.38,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(x+off,y,CELL_SIZE*0.12,0,Math.PI*2);
      ctx.fillStyle='rgba(180,100,120,0.08)';ctx.fill();
    }
  }
  const bx=-camX, by=-camY;
  ctx.strokeStyle='rgba(150,30,60,0.4)';ctx.lineWidth=4;
  ctx.strokeRect(bx,by,WORLD_W,WORLD_H);
  ctx.strokeStyle='rgba(150,30,60,0.15)';ctx.lineWidth=12;
  ctx.strokeRect(bx-4,by-4,WORLD_W+8,WORLD_H+8);
}

function drawBact(b){
  const sx=b.x-camX+shakeX, sy=b.y-camY+shakeY;
  if(sx<-30||sx>GW+30||sy<-30||sy>GH+30) return;
  ctx.save();ctx.translate(sx,sy);
  if(b.flash>0 && Math.floor(b.flash/2)%2===0){ctx.restore();return;}
  const c=b.cfg;
  ctx.shadowColor=c.col;ctx.shadowBlur=9;
  if(b.capsule>=2){
    ctx.beginPath();ctx.arc(0,0,b.r*1.5,0,Math.PI*2);
    ctx.fillStyle='rgba(255,200,100,0.25)';ctx.fill();
    ctx.strokeStyle='rgba(200,150,50,0.4)';ctx.lineWidth=2;ctx.setLineDash([3,3]);ctx.stroke();ctx.setLineDash([]);
  } else if(b.capsule===1){
    ctx.beginPath();ctx.arc(0,0,b.r*1.3,0,Math.PI*1.2);
    ctx.strokeStyle='rgba(200,150,50,0.2)';ctx.lineWidth=1.5;ctx.setLineDash([2,4]);ctx.stroke();ctx.setLineDash([]);
  }
  if(c.shape==='rod'){
    const angle=Math.atan2(b.vy,b.vx);ctx.rotate(angle);
    ctx.beginPath();ctx.ellipse(0,0,b.r*1.6,b.r*0.7,0,0,Math.PI*2);
    const rg=ctx.createRadialGradient(-2,-1,0,0,0,b.r*1.4);
    rg.addColorStop(0,'#77CCFF');rg.addColorStop(1,c.col);
    ctx.fillStyle=rg;ctx.fill();ctx.strokeStyle=c.dk;ctx.lineWidth=1.2;ctx.stroke();
    ctx.strokeStyle='rgba(68,153,221,0.5)';ctx.lineWidth=1;ctx.beginPath();
    for(let i=0;i<10;i++){const t=i/9;ctx.lineTo(-b.r*1.6-t*8, Math.sin(b.wobble*3+t*5)*4);}
    ctx.stroke();
  } else if(c.shape==='spiral'){
    const angle=Math.atan2(b.vy,b.vx);ctx.rotate(angle);
    ctx.strokeStyle=c.col;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();
    for(let i=0;i<30;i++){const t=i/29;const sx2=(t-0.5)*b.r*3.5;const sy2=Math.sin(b.wobble*4+t*8)*b.r*0.5;
      if(i===0)ctx.moveTo(sx2,sy2);else ctx.lineTo(sx2,sy2);}
    ctx.stroke();ctx.strokeStyle=c.dk;ctx.lineWidth=1.5;ctx.beginPath();
    for(let i=0;i<30;i++){const t=i/29;ctx.lineTo((t-0.5)*b.r*3.5, Math.sin(b.wobble*4+t*8)*b.r*0.5);}
    ctx.stroke();
  } else {
    ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);
    const cg=ctx.createRadialGradient(-b.r*0.2,-b.r*0.2,0,0,0,b.r);
    cg.addColorStop(0,c.col);cg.addColorStop(1,c.dk);
    ctx.fillStyle=cg;ctx.fill();ctx.strokeStyle=c.dk;ctx.lineWidth=1.2;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,b.r*0.35,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.1)';ctx.fill();
  }
  ctx.shadowBlur=0;
  ctx.font='600 11px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
  const lw=ctx.measureText(c.short).width+12;
  ctx.fillStyle='rgba(20,8,30,0.62)';ctx.beginPath();ctx.roundRect(-lw/2,-b.r-20,lw,15,7);ctx.fill();
  ctx.fillStyle='#FFF';ctx.fillText(c.short,0,-b.r-12);ctx.textBaseline='alphabetic';
  ctx.restore();
}

function drawTarget(t){
  const sx=t.x-camX+shakeX, sy=t.y-camY+shakeY;
  if(sx<-40||sx>GW+40||sy<-40||sy>GH+40) return;
  ctx.save();ctx.translate(sx,sy);
  if(t.flash>0 && Math.floor(t.flash/2)%2===0){ctx.restore();return;}
  const c=t.cfg;

  if(c.shape==='debris'){
    // Irregular gray fragments
    ctx.fillStyle=c.col;ctx.strokeStyle=c.dk;ctx.lineWidth=1.5;
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a=(i/6)*Math.PI*2+t.wobble;
      const r2=t.r*(0.6+Math.sin(a*3+t.wobble)*0.4);
      if(i===0)ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2);
      else ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
    }
    ctx.closePath();ctx.fill();ctx.stroke();
    // X mark
    ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-4,-4);ctx.lineTo(4,4);ctx.moveTo(4,-4);ctx.lineTo(-4,4);ctx.stroke();
  } else if(c.shape==='necrotic'){
    // Dark red irregular mass
    ctx.fillStyle=c.col;ctx.strokeStyle=c.dk;ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const a=(i/8)*Math.PI*2;
      const r2=t.r*(0.7+Math.sin(a*2+t.wobble*0.5)*0.3);
      if(i===0)ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2);
      else ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
    }
    ctx.closePath();ctx.fill();ctx.stroke();
    // Crack lines
    ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(-t.r*0.3,-t.r*0.2);ctx.lineTo(t.r*0.2,t.r*0.3);
    ctx.moveTo(t.r*0.1,-t.r*0.3);ctx.lineTo(-t.r*0.1,t.r*0.1);ctx.stroke();
    // Hits remaining indicator
    if(t.hitsLeft>1){
      ctx.font='bold 8px Fredoka,Arial';ctx.textAlign='center';ctx.fillStyle='#FFF';
      ctx.fillText('x'+t.hitsLeft,0,3);
    }
  } else if(c.shape==='apoptotic'){
    // Orange blebbing cell
    ctx.fillStyle=c.col;ctx.strokeStyle=c.dk;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,t.r,0,Math.PI*2);ctx.fill();ctx.stroke();
    // Blebs
    for(let i=0;i<4;i++){
      const a=(i/4)*Math.PI*2+t.wobble;
      ctx.beginPath();ctx.arc(Math.cos(a)*t.r*0.7,Math.sin(a)*t.r*0.7,t.r*0.3,0,Math.PI*2);
      ctx.fillStyle='rgba(255,180,80,0.5)';ctx.fill();
    }
    // Fragmented nucleus
    ctx.fillStyle='rgba(100,50,0,0.3)';
    ctx.beginPath();ctx.arc(-2,-1,t.r*0.2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(3,2,t.r*0.15,0,Math.PI*2);ctx.fill();
  } else if(c.shape==='fibrosis'){
    // Large yellow fibrous mass
    ctx.fillStyle=c.col;ctx.strokeStyle=c.dk;ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const a=(i/10)*Math.PI*2;
      const r2=t.r*(0.8+Math.sin(a*4+t.wobble*0.3)*0.2);
      if(i===0)ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2);
      else ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
    }
    ctx.closePath();ctx.fill();ctx.stroke();
    // Fiber lines
    ctx.strokeStyle='rgba(150,120,30,0.4)';ctx.lineWidth=1;
    for(let i=0;i<5;i++){
      const a1=Math.random()*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a1)*t.r*0.2,Math.sin(a1)*t.r*0.2);
      ctx.lineTo(Math.cos(a1+1)*t.r*0.6,Math.sin(a1+1)*t.r*0.6);
      ctx.stroke();
    }
    if(t.hitsLeft>1){
      ctx.font='bold 9px Fredoka,Arial';ctx.textAlign='center';ctx.fillStyle='#FFF';
      ctx.fillText('x'+t.hitsLeft,0,3);
    }
  }
  ctx.font='600 11px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
  const lw=ctx.measureText(c.short).width+12;
  ctx.fillStyle='rgba(20,8,30,0.62)';ctx.beginPath();ctx.roundRect(-lw/2,-t.r-20,lw,15,7);ctx.fill();
  ctx.fillStyle='#FFF';ctx.fillText(c.short,0,-t.r-12);ctx.textBaseline='alphabetic';
  ctx.restore();
}

function drawHazard(h){
  const sx=h.x-camX+shakeX, sy=h.y-camY+shakeY;

  // Trail
  for(const tr of h.trail){
    const tx=tr.x-camX+shakeX, ty=tr.y-camY+shakeY;
    ctx.globalAlpha=tr.life*0.3;
    ctx.beginPath();ctx.arc(tx,ty,h.r*0.5*tr.life,0,Math.PI*2);
    ctx.fillStyle='rgba(255,50,50,0.4)';ctx.fill();
  }
  ctx.globalAlpha=1;

  if(sx<-40||sx>GW+40||sy<-40||sy>GH+40) return;
  ctx.save();ctx.translate(sx,sy);

  // Aura vermelha pulsante (aditiva)
  const pulse=0.5+Math.sin(frame*0.15)*0.5, ar=h.r+14+pulse*8;
  ctx.save();ctx.globalCompositeOperation='lighter';
  const hg=ctx.createRadialGradient(0,0,h.r*0.5,0,0,ar);hg.addColorStop(0,`rgba(255,40,60,${0.22+pulse*0.18})`);hg.addColorStop(1,'rgba(255,40,60,0)');
  ctx.beginPath();ctx.arc(0,0,ar,0,Math.PI*2);ctx.fillStyle=hg;ctx.fill();ctx.restore();
  ctx.shadowColor='rgba(255,40,60,0.9)';ctx.shadowBlur=14;

  if(h.type==='TOXO'){
    // Crescent / half-moon shape
    const angle=Math.atan2(P.y-h.y,P.x-h.x);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.ellipse(0,0,h.r*1.4,h.r*0.5,0,0,Math.PI*2);
    const tg=ctx.createRadialGradient(-2,0,0,0,0,h.r*1.2);
    tg.addColorStop(0,'#DDAA44');tg.addColorStop(1,'#886622');
    ctx.fillStyle=tg;ctx.fill();
    ctx.strokeStyle='#664411';ctx.lineWidth=1.5;ctx.stroke();
    // Inner organelle
    ctx.beginPath();ctx.arc(h.r*0.3,0,h.r*0.2,0,Math.PI*2);
    ctx.fillStyle='rgba(80,50,10,0.4)';ctx.fill();
  } else {
    // Leishmania - oval with flagellum
    const angle=Math.atan2(P.y-h.y,P.x-h.x);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.ellipse(0,0,h.r*1.3,h.r*0.6,0,0,Math.PI*2);
    const lg=ctx.createRadialGradient(-1,0,0,0,0,h.r);
    lg.addColorStop(0,'#558844');lg.addColorStop(1,'#336633');
    ctx.fillStyle=lg;ctx.fill();
    ctx.strokeStyle='#224422';ctx.lineWidth=1.2;ctx.stroke();
    // Flagellum
    ctx.strokeStyle='rgba(50,100,50,0.7)';ctx.lineWidth=1.5;ctx.lineCap='round';
    ctx.beginPath();
    for(let i=0;i<12;i++){
      const t=i/11;
      const fx=-h.r*1.3-t*15;
      const fy=Math.sin(h.wobble*3+t*6)*4;
      if(i===0)ctx.moveTo(fx,fy);else ctx.lineTo(fx,fy);
    }
    ctx.stroke();
    // Kinetoplast
    ctx.beginPath();ctx.arc(-h.r*0.4,0,h.r*0.15,0,Math.PI*2);
    ctx.fillStyle='rgba(20,50,20,0.5)';ctx.fill();
  }

  ctx.restore();
}

function drawPlayer(){
  const sx=P.x-camX+shakeX, sy=P.y-camY+shakeY;
  ctx.save();ctx.translate(sx,sy);

  const cfg=CHAR_CONFIG[charType];

  // Aura de poder (aditiva) + brilho suave permanente
  if(P.power>0){
    const pa=0.4+Math.sin(frame*0.1)*0.15, ar=P.r+20+Math.sin(frame*0.08)*5;
    const col=charType==='M1'?'255,200,50':charType==='NEUTRO'?'100,170,255':'100,255,170';
    ctx.save();ctx.globalCompositeOperation='lighter';
    const ag=ctx.createRadialGradient(0,0,P.r*0.6,0,0,ar);ag.addColorStop(0,`rgba(${col},${pa})`);ag.addColorStop(1,`rgba(${col},0)`);
    ctx.beginPath();ctx.arc(0,0,ar,0,Math.PI*2);ctx.fillStyle=ag;ctx.fill();ctx.restore();
  }
  ctx.shadowColor=cfg.color;ctx.shadowBlur=P.power>0?24:12;

  // Neutro AoE ring
  if(charType==='NEUTRO' && P.power>0){
    const aoR=120;
    ctx.beginPath();ctx.arc(0,0,aoR,0,Math.PI*2);
    ctx.strokeStyle=`rgba(100,170,255,${0.15+Math.sin(frame*0.15)*0.1})`;
    ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([]);
  }

  // Movement direction indicator
  if(P.moving){
    ctx.beginPath();
    ctx.arc(0,0,P.r+15,P.moveAngle-0.3,P.moveAngle+0.3);
    ctx.strokeStyle=`rgba(${charType==='M1'?'180,100,200':charType==='NEUTRO'?'100,150,220':'100,180,140'},0.2)`;
    ctx.lineWidth=3;ctx.stroke();
  }

  // Pseudopods
  const targetArr = charType==='M2' ? targets : bacteria;
  for(let i=0;i<7;i++){
    const baseAngle=(i/7)*Math.PI*2+P.pseudo;
    let extension=0.5;
    if(P.moving){
      const diff=Math.abs(((baseAngle-P.moveAngle)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI);
      extension=0.3+Math.cos(diff)*0.5+0.2;
    }
    let nearestDist=200;
    for(const b of targetArr){
      if(b.eating||b.repairing) continue;
      const d=dist(P.x,P.y,b.x,b.y);
      if(d<nearestDist){
        nearestDist=d;
        const bAngle=Math.atan2(b.y-P.y,b.x-P.x);
        const diff2=Math.abs(((baseAngle-bAngle)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI);
        if(diff2<0.8) extension=Math.max(extension,0.9-d/200);
      }
    }
    const len=P.r*0.4*(0.4+extension*0.8)+Math.sin(P.pseudo*2+i*1.5)*3;
    const px=Math.cos(baseAngle)*(P.r*0.7+len);
    const py=Math.sin(baseAngle)*(P.r*0.7+len);
    ctx.beginPath();ctx.ellipse(px,py,7+len*0.15,5+len*0.1,baseAngle,0,Math.PI*2);
    ctx.fillStyle=cfg.pseudoCol;ctx.fill();
  }

  // Main body
  ctx.beginPath();ctx.arc(0,0,P.r,0,Math.PI*2);
  const pg=ctx.createRadialGradient(-P.r*0.15,-P.r*0.15,0,0,0,P.r);
  pg.addColorStop(0,cfg.bodyColors[0]);pg.addColorStop(0.5,cfg.bodyColors[1]);pg.addColorStop(1,cfg.bodyColors[2]);
  ctx.fillStyle=pg;ctx.fill();
  ctx.strokeStyle=cfg.dark;ctx.lineWidth=2;ctx.stroke();

  // Damage flash overlay
  if(P.damageFlash>0){
    ctx.beginPath();ctx.arc(0,0,P.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,0,0,${P.damageFlash/15*0.4})`;ctx.fill();
  }

  // Nucleus (different per character)
  if(charType==='NEUTRO'){
    // Multilobed nucleus (3 lobes)
    ctx.fillStyle=cfg.nucleusCol;
    const lobes=[[-P.r*0.2,-P.r*0.15],[P.r*0.1,P.r*0.1],[-P.r*0.05,P.r*0.2]];
    for(const [lx,ly] of lobes){
      ctx.beginPath();ctx.ellipse(lx,ly,P.r*0.18,P.r*0.14,Math.random()*0.5,0,Math.PI*2);ctx.fill();
    }
    // Connections between lobes
    ctx.strokeStyle=cfg.nucleusCol;ctx.lineWidth=P.r*0.08;
    ctx.beginPath();ctx.moveTo(lobes[0][0],lobes[0][1]);ctx.lineTo(lobes[1][0],lobes[1][1]);
    ctx.lineTo(lobes[2][0],lobes[2][1]);ctx.stroke();
  } else {
    // Standard kidney-bean nucleus
    ctx.beginPath();ctx.ellipse(-P.r*0.08,P.r*0.05,P.r*0.35,P.r*0.28,0.3,0,Math.PI*2);
    ctx.fillStyle=cfg.nucleusCol;ctx.fill();
  }

  // Phagosomes inside
  for(const ph of phagosomes){
    const a=ph.life/90;
    ctx.globalAlpha=a;
    ctx.beginPath();ctx.arc(ph.ox,ph.oy,ph.r,0,Math.PI*2);
    ctx.fillStyle=ph.col;ctx.fill();
    ctx.strokeStyle=cfg.uiDark;ctx.lineWidth=1;ctx.stroke();
  }
  ctx.globalAlpha=1;

  // Lysosomes
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2+P.pseudo*0.7;
    const lr=P.r*0.55;
    ctx.beginPath();ctx.arc(Math.cos(a)*lr,Math.sin(a)*lr,2.5,0,Math.PI*2);
    ctx.fillStyle='rgba(200,120,60,0.3)';ctx.fill();
  }

  // Eyes
  ctx.shadowBlur=0;
  const eOff=P.moving?P.moveAngle:0;
  const ex1=Math.cos(eOff-0.35)*P.r*0.35;
  const ey1=Math.sin(eOff-0.35)*P.r*0.35;
  const ex2=Math.cos(eOff+0.35)*P.r*0.35;
  const ey2=Math.sin(eOff+0.35)*P.r*0.35;
  [[ex1,ey1],[ex2,ey2]].forEach(([x,y])=>{
    ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fillStyle='#FFEEFF';ctx.fill();
    const px2=x+Math.cos(eOff)*1.5, py2=y+Math.sin(eOff)*1.5;
    ctx.beginPath();ctx.arc(px2,py2,2.2,0,Math.PI*2);ctx.fillStyle=cfg.eyeCol;ctx.fill();
  });

  // Atordoado (protozoário)
  if(P.stun>0){
    ctx.beginPath();ctx.arc(0,0,P.r+4,0,Math.PI*2);ctx.strokeStyle='rgba(255,80,80,0.7)';ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([]);
    ctx.font='700 11px '+FONT;ctx.textAlign='center';ctx.fillStyle='#FFF';ctx.fillText('zz',P.r*0.6,-P.r*0.6);
  }

  ctx.restore();
}

function drawParticles(){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of particles){
    const sx=p.x-camX+shakeX,sy=p.y-camY+shakeY;
    ctx.globalAlpha=p.life;ctx.shadowColor=p.col;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(sx,sy,p.r*p.life,0,Math.PI*2);
    ctx.fillStyle=p.col;ctx.fill();
  }
  ctx.restore();ctx.globalAlpha=1;
}

function drawTexts(){
  for(const t of texts){
    const sx=t.x-camX+shakeX,sy=t.y-camY+shakeY;
    ctx.globalAlpha=t.life;
    const s=t.sz*(1+(1-t.life)*0.2);
    ctx.font=`bold ${s}px Fredoka,Arial,sans-serif`;ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillText(t.txt,sx+1,sy+1);
    ctx.fillStyle=t.col;ctx.fillText(t.txt,sx,sy);
  }
  ctx.globalAlpha=1;
}

function drawUI(){
  const cfg=CHAR_CONFIG[charType];

  // Barra de INFECÇÃO / DEGRADAÇÃO (enche = perde)
  const bw=180,bh=14,bx=15,by=15;
  const loadNow=currentLoad(), pct=Math.min(1,loadNow/MODES[mode].maxLoad);
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,bh/2);ctx.fill();
  ctx.save();
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,bh/2);ctx.clip();
  const hg=ctx.createLinearGradient(bx,0,bx+bw,0);
  if(P.power>0){
    // Power-colored HP bar
    if(charType==='M1'){hg.addColorStop(0,'#FFD700');hg.addColorStop(1,'#FF8800');}
    else if(charType==='NEUTRO'){hg.addColorStop(0,'#66BBFF');hg.addColorStop(1,'#3388DD');}
    else{hg.addColorStop(0,'#66FFAA');hg.addColorStop(1,'#33CC77');}
  } else if(pct<0.5){hg.addColorStop(0,'#55DD77');hg.addColorStop(1,'#33AA55');}
  else if(pct<0.75){hg.addColorStop(0,'#DDDD44');hg.addColorStop(1,'#AAAA33');}
  else{hg.addColorStop(0,'#DD4444');hg.addColorStop(1,'#AA2222');}
  ctx.fillStyle=hg;ctx.fillRect(bx,by,bw*pct,bh);
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,bh/2);ctx.stroke();

  ctx.font='bold 10px Fredoka,Arial,sans-serif';ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.fillText((charType==='M2'?'DEGRADAÇÃO DO TECIDO':'INFECÇÃO DO TECIDO')+'  '+Math.round(pct*100)+'%',bx,by+bh+12);

  // Power bar (below HP)
  if(P.power>0){
    const pw=150,ph2=8,px2=15,py2=by+bh+18;
    const ppct=P.power/600;
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.roundRect(px2,py2,pw,ph2,ph2/2);ctx.fill();
    ctx.save();
    ctx.beginPath();ctx.roundRect(px2,py2,pw,ph2,ph2/2);ctx.clip();
    let powerCol;
    if(charType==='M1') powerCol='#FFD700';
    else if(charType==='NEUTRO') powerCol='#66BBFF';
    else powerCol='#66FFAA';
    ctx.fillStyle=powerCol;
    ctx.fillRect(px2,py2,pw*ppct,ph2);
    ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(px2,py2,pw,ph2,ph2/2);ctx.stroke();
    ctx.font='bold 8px Fredoka,Arial,sans-serif';
    ctx.fillStyle=powerCol;ctx.fillText(cfg.cytokine+' ATIVO',px2,py2+ph2+10);
  }

  // Score
  ctx.font="bold 20px 'Rubik Mono One','Courier New',monospace";ctx.textAlign='right';
  ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillText(P.eaten+' '+cfg.scoreLabel,GW-13,32);
  ctx.fillStyle='#FFF';ctx.fillText(P.eaten+' '+cfg.scoreLabel,GW-15,30);

  // Character name
  ctx.font='bold 10px Fredoka,Arial,sans-serif';ctx.textAlign='right';
  ctx.fillStyle=cfg.uiAccent;ctx.fillText(cfg.name,GW-15,48);

  // Minimap
  const mmW=100,mmH=70,mmX=GW-mmW-10,mmY=GH-mmH-10;
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.fillRect(mmX,mmY,mmW,mmH);
  ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=1;
  ctx.strokeRect(mmX,mmY,mmW,mmH);

  // Dots on minimap
  if(charType==='M2'){
    for(const t of targets){
      if(t.repairing) continue;
      const mx=mmX+t.x/WORLD_W*mmW;
      const my=mmY+t.y/WORLD_H*mmH;
      ctx.beginPath();ctx.arc(mx,my,1.5,0,Math.PI*2);
      ctx.fillStyle=t.cfg.col;ctx.fill();
    }
  } else {
    for(const b of bacteria){
      if(b.eating) continue;
      const mx=mmX+b.x/WORLD_W*mmW;
      const my=mmY+b.y/WORLD_H*mmH;
      ctx.beginPath();ctx.arc(mx,my,1.5,0,Math.PI*2);
      ctx.fillStyle=b.cfg.col;ctx.fill();
    }
  }

  // Hazards on minimap (blinking red)
  if(Math.floor(frame/10)%2===0){
    for(const h of hazards){
      const mx=mmX+h.x/WORLD_W*mmW;
      const my=mmY+h.y/WORLD_H*mmH;
      ctx.beginPath();ctx.arc(mx,my,3,0,Math.PI*2);
      ctx.fillStyle='#FF3333';ctx.fill();
      // Danger icon
      ctx.font='bold 6px Fredoka,Arial';ctx.textAlign='center';
      ctx.fillStyle='#FFF';ctx.fillText('!',mx,my+2);
    }
  }

  // Player on minimap
  const pmx=mmX+P.x/WORLD_W*mmW;
  const pmy=mmY+P.y/WORLD_H*mmH;
  ctx.beginPath();ctx.arc(pmx,pmy,3,0,Math.PI*2);
  ctx.fillStyle=cfg.uiAccent;ctx.fill();

  // Viewport rect
  ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;
  ctx.strokeRect(mmX+camX/WORLD_W*mmW,mmY+camY/WORLD_H*mmH,GW/WORLD_W*mmW,GH/WORLD_H*mmH);

  // Tempo restante (meta de sobrevivência)
  const remain=Math.max(0,Math.ceil((targetFrames-elapsed)/60));
  ctx.fillStyle='rgba(20,8,30,0.6)';ctx.beginPath();ctx.roundRect(GW/2-40,8,80,38,10);ctx.fill();
  ctx.font="bold 22px 'Rubik Mono One','Courier New',monospace";ctx.textAlign='center';
  ctx.fillStyle=remain<=10?'#FF7777':'#FFF';ctx.fillText(remain+'s',GW/2,30);
  ctx.font='9px Fredoka,Arial,sans-serif';ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fillText('resta',GW/2,41);

  // Indicadores de protozoário fora da tela (seta vermelha na borda)
  for(const h of hazards){
    const sx=h.x-camX, sy=h.y-camY;
    if(sx>=0&&sx<=GW&&sy>=0&&sy<=GH) continue;
    const m=18, cx=Math.max(m,Math.min(GW-m,sx)), cy=Math.max(m,Math.min(GH-m,sy));
    const ang=Math.atan2(sy-cy,sx-cx);
    ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);
    const pulse=0.7+Math.sin(frame*0.2)*0.3;
    ctx.fillStyle=`rgba(255,50,50,${pulse})`;
    ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-6,-7);ctx.lineTo(-6,7);ctx.closePath();ctx.fill();
    ctx.restore();
  }

  // Alertas (com fundo pra ler no tecido claro)
  for(const a of alerts){
    ctx.globalAlpha=Math.min(1,a.life*2);
    ctx.font='bold 14px Fredoka,Arial,sans-serif';ctx.textAlign='center';
    const tw=ctx.measureText(a.msg).width+24;
    ctx.fillStyle='rgba(20,8,30,0.72)';ctx.beginPath();ctx.roundRect(GW/2-tw/2,a.y-15,tw,22,8);ctx.fill();
    ctx.fillStyle=a.col;ctx.fillText(a.msg,GW/2,a.y+1);
  }
  ctx.globalAlpha=1;

  // Curiosidade legível (toast com quebra de linha, some devagar)
  if(factToast && state==='playing'){
    ctx.globalAlpha=Math.min(1,factToast.life*3);
    ctx.font='12px Fredoka,Arial,sans-serif';ctx.textAlign='center';
    const lines=wrapText(factToast.text,GW*0.6);
    const bh=22+lines.length*16, bw=GW*0.66, bx=GW/2-bw/2, by=GH-bh-58;
    ctx.fillStyle='rgba(20,8,40,0.82)';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,10);ctx.fill();
    ctx.strokeStyle='rgba(136,221,255,0.45)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(bx,by,bw,bh,10);ctx.stroke();
    ctx.font='bold 11px Fredoka,Arial,sans-serif';ctx.fillStyle='#88DDFF';ctx.fillText('VOCÊ SABIA?',GW/2,by+14);
    ctx.font='12px Fredoka,Arial,sans-serif';ctx.fillStyle='#E8F4FF';
    for(let i=0;i<lines.length;i++) ctx.fillText(lines[i],GW/2,by+30+i*16);
    ctx.globalAlpha=1;
  }

  // Alerta: carga perto do máximo
  if(pct>0.75){
    const wa=((pct-0.75)/0.25*0.15)*(0.5+Math.sin(frame*0.12)*0.5);
    ctx.fillStyle=`rgba(200,0,0,${wa})`;ctx.fillRect(0,0,GW,GH);
  }

  // Damage flash (full screen red flash)
  if(P.damageFlash>0){
    ctx.fillStyle=`rgba(255,0,0,${P.damageFlash/15*0.15})`;
    ctx.fillRect(0,0,GW,GH);
  }
}

function wrapText(text,maxW){
  const ws=text.split(' ');let lines=[],cur='';
  for(const w of ws){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;
}

function drawSelect(){
  ctx.fillStyle='#1A0A20';ctx.fillRect(0,0,GW,GH);

  // Background subtle pattern
  const t=Date.now()*0.001;
  for(let i=0;i<20;i++){
    const x=((i*137+t*20)%GW);
    const y=((i*89+t*10)%GH);
    ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);
    ctx.fillStyle='rgba(100,50,150,0.15)';ctx.fill();
  }

  ctx.font='bold 28px Fredoka,Arial,sans-serif';ctx.textAlign='center';
  ctx.fillStyle='#F0E0FF';
  ctx.shadowColor='#CC55FF';ctx.shadowBlur=15;
  ctx.fillText('ESCOLHA SEU PERSONAGEM',GW/2,45);
  ctx.shadowBlur=0;

  const cards=['M1','NEUTRO','M2'];
  const cardW=220, cardH=310, gap=20;
  const totalW=cardW*3+gap*2;
  const startX=(GW-totalW)/2;
  const cardY=65;

  cards.forEach((key,idx)=>{
    const cfg=CHAR_CONFIG[key];
    const cx=startX+idx*(cardW+gap);
    const isHover=selectHover===idx;

    // Card background
    const alpha=isHover?0.5:0.3;
    ctx.fillStyle=`rgba(40,20,60,${alpha})`;
    ctx.beginPath();ctx.roundRect(cx,cardY,cardW,cardH,12);ctx.fill();

    // Border
    ctx.strokeStyle=isHover?cfg.color:'rgba(150,100,200,0.3)';
    ctx.lineWidth=isHover?3:1.5;
    ctx.beginPath();ctx.roundRect(cx,cardY,cardW,cardH,12);ctx.stroke();

    // Hover glow
    if(isHover){
      ctx.shadowColor=cfg.color;ctx.shadowBlur=20;
      ctx.beginPath();ctx.roundRect(cx,cardY,cardW,cardH,12);ctx.stroke();
      ctx.shadowBlur=0;
    }

    // Character preview (animated)
    const prevX=cx+cardW/2, prevY=cardY+65;
    ctx.save();ctx.translate(prevX,prevY);

    // Pseudopods
    const pR=key==='NEUTRO'?18:22;
    for(let i=0;i<5;i++){
      const a=(i/5)*Math.PI*2+t*0.8;
      const len=pR*0.4+Math.sin(t*2+i*1.3)*3;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a)*(pR*0.6+len),Math.sin(a)*(pR*0.6+len),5,3.5,a,0,Math.PI*2);
      ctx.fillStyle=cfg.pseudoCol;ctx.fill();
    }

    // Body
    ctx.beginPath();ctx.arc(0,0,pR,0,Math.PI*2);
    const pg=ctx.createRadialGradient(-pR*0.15,-pR*0.15,0,0,0,pR);
    pg.addColorStop(0,cfg.bodyColors[0]);pg.addColorStop(0.5,cfg.bodyColors[1]);pg.addColorStop(1,cfg.bodyColors[2]);
    ctx.fillStyle=pg;ctx.fill();
    ctx.strokeStyle=cfg.dark;ctx.lineWidth=1.5;ctx.stroke();

    // Nucleus
    if(key==='NEUTRO'){
      ctx.fillStyle=cfg.nucleusCol;
      const lobes2=[[-pR*0.2,-pR*0.12],[pR*0.1,pR*0.08],[-pR*0.05,pR*0.18]];
      for(const [lx,ly] of lobes2){
        ctx.beginPath();ctx.ellipse(lx,ly,pR*0.16,pR*0.12,0,0,Math.PI*2);ctx.fill();
      }
      ctx.strokeStyle=cfg.nucleusCol;ctx.lineWidth=pR*0.07;
      ctx.beginPath();ctx.moveTo(lobes2[0][0],lobes2[0][1]);ctx.lineTo(lobes2[1][0],lobes2[1][1]);
      ctx.lineTo(lobes2[2][0],lobes2[2][1]);ctx.stroke();
    } else {
      ctx.beginPath();ctx.ellipse(-pR*0.08,pR*0.05,pR*0.32,pR*0.25,0.3,0,Math.PI*2);
      ctx.fillStyle=cfg.nucleusCol;ctx.fill();
    }

    // Eyes
    [[-pR*0.25,-pR*0.2],[pR*0.15,-pR*0.2]].forEach(([ex,ey])=>{
      ctx.beginPath();ctx.arc(ex,ey,3.5,0,Math.PI*2);ctx.fillStyle='#FFEEFF';ctx.fill();
      ctx.beginPath();ctx.arc(ex+1,ey,1.6,0,Math.PI*2);ctx.fillStyle=cfg.eyeCol;ctx.fill();
    });

    ctx.restore();

    // Name
    ctx.font='bold 16px Fredoka,Arial,sans-serif';ctx.textAlign='center';
    ctx.fillStyle=cfg.color;
    ctx.fillText(cfg.name,cx+cardW/2,cardY+110);

    // Subtitle
    ctx.font='bold 11px Fredoka,Arial,sans-serif';
    ctx.fillStyle=cfg.light;
    ctx.fillText(cfg.desc,cx+cardW/2,cardY+128);

    // Description (word-wrapped)
    ctx.font='11px Fredoka,Arial,sans-serif';
    ctx.fillStyle='#CCBBDD';
    const detLines=wrapText(cfg.detail,cardW-24);
    for(let li=0;li<detLines.length;li++) ctx.fillText(detLines[li],cx+cardW/2,cardY+150+li*14);

    // Stats
    const detOff=(detLines.length-1)*14;
    const statY=cardY+172+detOff;
    ctx.font='10px Fredoka,Arial,sans-serif';ctx.textAlign='left';
    const stats=[
      ['Velocidade',cfg.speed,3.5],
      ['Raio',cfg.radius,30],
    ];
    stats.forEach(([label,val,max],si)=>{
      const sy2=statY+si*18;
      ctx.fillStyle='#9988AA';ctx.fillText(label,cx+12,sy2);
      // Bar
      const barX=cx+80,barW=120,barH=6;
      ctx.fillStyle='rgba(0,0,0,0.3)';
      ctx.beginPath();ctx.roundRect(barX,sy2-6,barW,barH,3);ctx.fill();
      ctx.fillStyle=cfg.color;
      ctx.beginPath();ctx.roundRect(barX,sy2-6,barW*(val/max),barH,3);ctx.fill();
    });

    // Cytokine info
    ctx.font='bold 10px Fredoka,Arial,sans-serif';ctx.textAlign='center';
    ctx.fillStyle='#FFD700';
    ctx.fillText('Citocina: '+cfg.cytokine,cx+cardW/2,statY+62);
    ctx.font='9px Fredoka,Arial,sans-serif';
    ctx.fillStyle='#CCAA66';
    const cytoLines=wrapText(cfg.cytokineDesc,cardW-24);
    for(let li=0;li<cytoLines.length;li++) ctx.fillText(cytoLines[li],cx+cardW/2,statY+76+li*12);
    const cytoOff=(cytoLines.length-1)*12;

    // Special death message
    ctx.font='9px Fredoka,Arial,sans-serif';
    ctx.fillStyle='#AA7777';
    ctx.fillText('Morte: '+cfg.deathMsg,cx+cardW/2,statY+94+cytoOff);

    // Select prompt
    if(isHover){
      ctx.font='bold 12px Fredoka,Arial,sans-serif';
      ctx.fillStyle='#FFF';
      const bl2=Math.sin(Date.now()*0.005)*0.3+0.7;
      ctx.globalAlpha=bl2;
      ctx.fillText('CLIQUE PARA SELECIONAR',cx+cardW/2,cardY+cardH-12);
      ctx.globalAlpha=1;
    }
  });
}

  ctx.strokeStyle='rgba(136,221,255,0.25)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(GW*0.08,fy-8,GW*0.84,fh,8);ctx.stroke();

  ctx.font='bold 14px Fredoka,Arial,sans-serif';ctx.fillStyle='#88DDFF';ctx.fillText('Voce sabia?',GW/2,fy+12);
  ctx.font='12px Fredoka,Arial,sans-serif';ctx.fillStyle='#CCDDFF';
  const fact=facts[P.eaten%facts.length];
  const ws=fact.split(' ');let ls=[],cl2='';
  for(const w of ws){const tt=cl2?cl2+' '+w:w;if(ctx.measureText(tt).width>GW*0.75){ls.push(cl2);cl2=w;}else cl2=tt;}
  if(cl2)ls.push(cl2);
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],GW/2,fy+30+i*17);

  ctx.font='bold 16px Fredoka,Arial,sans-serif';
  const bl=Math.sin(Date.now()*0.004)*0.5+0.5;
  ctx.fillStyle=`rgba(255,255,255,${0.5+bl*0.5})`;
  const mob='ontouchstart' in window;
  ctx.fillText(mob?'TOQUE PARA JOGAR NOVAMENTE':'CLIQUE PARA JOGAR NOVAMENTE',GW/2,GH*0.9);
}

const LEGENDS={
  M1:['A barra INFECÇÃO sobe conforme as bactérias se multiplicam (elas se dividem!). Fagocite para baixá-la — se encher, o tecido é tomado.',
      'PROTOZOÁRIOS (aura vermelha) infectam você: atordoam e a infecção dá um salto. Fuja — ou ative o TNF-α e destrua-os!',
      'A cada 10 fagocitadas você libera a citocina TNF-α: mais veloz, maior alcance.'],
  NEUTRO:['A barra INFECÇÃO sobe conforme as bactérias se multiplicam. Você é rápido: coma sem parar para segurá-la.',
      'PROTOZOÁRIOS infectam você: atordoam e a infecção dá um salto. Fuja — ou use o burst de IL-8 para eliminá-los.',
      'A cada 10 fagocitadas: burst respiratório (IL-8) — destrói tudo ao redor.'],
  M2:['A barra DEGRADAÇÃO sobe conforme detritos, necrose e fibrose se acumulam (a necrose se espalha!). Repare para baixá-la — se encher, o tecido colapsa.',
      'PROTOZOÁRIOS infectam você e o M2 NÃO consegue matá-los (é permissivo). Só fugir!',
      'A cada 10 reparos: IL-10 — reparo 2x mais rápido e a degradação para por 10 segundos.'],
};

function drawModeSelect(){
  ctx.fillStyle='#1A0A20';ctx.fillRect(0,0,GW,GH);
  const cfg=CHAR_CONFIG[charType];
  ctx.textAlign='center';
  ctx.font='bold 26px Fredoka,Arial,sans-serif';ctx.shadowColor=cfg.color;ctx.shadowBlur=14;ctx.fillStyle='#F0E0FF';
  ctx.fillText(cfg.name.toUpperCase()+' · COMO JOGAR',GW/2,44);ctx.shadowBlur=0;

  // Legenda (3 regras)
  const rules=LEGENDS[charType];
  const lx=GW*0.09, lw=GW*0.82, ly=70;
  ctx.fillStyle='rgba(40,20,60,0.55)';ctx.beginPath();ctx.roundRect(lx,ly,lw,150,12);ctx.fill();
  ctx.strokeStyle='rgba(150,100,200,0.35)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(lx,ly,lw,150,12);ctx.stroke();
  ctx.textAlign='left';
  let yy=ly+22;
  for(let i=0;i<rules.length;i++){
    ctx.fillStyle=cfg.color;ctx.beginPath();ctx.arc(lx+20,yy-4,5,0,Math.PI*2);ctx.fill();
    ctx.font='12px Fredoka,Arial,sans-serif';ctx.fillStyle='#E6DAF2';
    const lines=wrapText(rules[i],lw-56);
    for(let j=0;j<lines.length;j++){ctx.fillText(lines[j],lx+34,yy+j*15);}
    yy+=Math.max(1,lines.length)*15+16;
  }

  ctx.textAlign='center';
  ctx.font='13px Fredoka,Arial,sans-serif';ctx.fillStyle='#CDBBEE';
  ctx.fillText('Segure a barra abaixo do máximo até o tempo acabar.',GW/2,243);

  const descs={FACIL:'Drena devagar, poucos protozoários.',MEDIO:'Equilibrado.',DIFICIL:'Drena rápido, protozoários frequentes.'};
  for(const r of modeButtonRects()){
    const M=MODES[r.key];
    const hov=mouseX>=r.x&&mouseX<=r.x+r.w&&mouseY>=r.y&&mouseY<=r.y+r.h;
    ctx.fillStyle=hov?'rgba(255,255,255,0.10)':'rgba(35,22,55,0.85)';
    ctx.beginPath();ctx.roundRect(r.x,r.y,r.w,r.h,12);ctx.fill();
    ctx.strokeStyle=M.col;ctx.lineWidth=hov?3:2;ctx.beginPath();ctx.roundRect(r.x,r.y,r.w,r.h,12);ctx.stroke();
    ctx.fillStyle=M.col;ctx.font='bold 20px Fredoka,Arial,sans-serif';ctx.fillText(M.label,r.x+r.w/2,r.y+28);
    ctx.fillStyle='#FFF';ctx.font="bold 15px 'Rubik Mono One','Courier New',monospace";ctx.fillText(M.secs+'s',r.x+r.w/2,r.y+50);
    ctx.fillStyle='rgba(220,210,235,0.6)';ctx.font='9px Fredoka,Arial,sans-serif';ctx.fillText(descs[r.key],r.x+r.w/2,r.y+r.h-8);
  }
  const mob='ontouchstart' in window;
  ctx.font='11px Fredoka,Arial,sans-serif';ctx.fillStyle='rgba(200,180,220,0.55)';
  ctx.fillText(mob?'Toque em uma dificuldade':'Clique numa dificuldade  ·  ou tecle 1 / 2 / 3  ·  Esc volta',GW/2,GH-14);
}

function drawWin(){
  ctx.fillStyle='rgba(6,20,10,0.86)';ctx.fillRect(0,0,GW,GH);
  const cfg=CHAR_CONFIG[charType];
  const title=charType==='M2'?'TECIDO REPARADO!':'INFECÇÃO CONTIDA!';
  ctx.font='bold 38px Fredoka,Arial,sans-serif';ctx.textAlign='center';
  ctx.shadowColor='#55FF99';ctx.shadowBlur=18;ctx.fillStyle='#66FF99';
  ctx.fillText(title,GW/2,GH*0.13);ctx.shadowBlur=0;
  ctx.font='13px Fredoka,Arial,sans-serif';ctx.fillStyle='#BFE8CC';
  const sub=charType==='M2'
    ? 'O '+cfg.name+' manteve a homeostase do tecido por '+MODES[mode].secs+'s.'
    : 'O '+cfg.name+' segurou a infecção por '+MODES[mode].secs+'s sem entrar em colapso.';
  ctx.fillText(sub,GW/2,GH*0.13+30);
  ctx.font="bold 22px 'Rubik Mono One','Courier New',monospace";ctx.fillStyle='#FFF';
  ctx.fillText(MODES[mode].label+' concluído · '+P.eaten+' '+cfg.scoreLabel,GW/2,GH*0.3);
  if(P.eaten>=highScore&&P.eaten>0){
    ctx.font='bold 15px Fredoka,Arial,sans-serif';ctx.fillStyle='#FFD700';
    ctx.shadowColor='#FFD700';ctx.shadowBlur=8;ctx.fillText('NOVO RECORDE!',GW/2,GH*0.3+26);ctx.shadowBlur=0;
  }
  const facts=getFacts();
  const fy=GH*0.48,fh=GH*0.27;
  ctx.fillStyle='rgba(20,60,40,0.4)';ctx.beginPath();ctx.roundRect(GW*0.08,fy-8,GW*0.84,fh,8);ctx.fill();
  ctx.strokeStyle='rgba(102,255,170,0.25)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(GW*0.08,fy-8,GW*0.84,fh,8);ctx.stroke();
  ctx.font='bold 14px Fredoka,Arial,sans-serif';ctx.fillStyle='#88FFBB';ctx.fillText('Você sabia?',GW/2,fy+12);
  ctx.font='12px Fredoka,Arial,sans-serif';ctx.fillStyle='#CCEEDD';
  const ls=wrapText(facts[P.eaten%facts.length],GW*0.75);
  for(let i=0;i<ls.length;i++) ctx.fillText(ls[i],GW/2,fy+30+i*17);
  ctx.font='bold 16px Fredoka,Arial,sans-serif';
  const bl=Math.sin(Date.now()*0.004)*0.5+0.5;
  ctx.fillStyle=`rgba(255,255,255,${0.5+bl*0.5})`;
  const mob='ontouchstart' in window;
  ctx.fillText(mob?'TOQUE PARA CONTINUAR':'ESPAÇO PARA CONTINUAR',GW/2,GH*0.9);
}

function render(){
  ctx.clearRect(0,0,GW,GH);
  if(state==='menu'){drawMenu();drawHomeBtn();drawMuteBtn();return;}
  if(state==='select'){drawSelect();drawHomeBtn();drawMuteBtn();return;}
  if(state==='modeselect'){drawModeSelect();drawHomeBtn();drawMuteBtn();return;}

  drawBG();

  if(charType==='M2'){
    for(const t of targets) drawTarget(t);
  } else {
    for(const b of bacteria) drawBact(b);
  }

  for(const h of hazards) drawHazard(h);
  drawPlayer();
  drawParticles();
  drawTexts();
  vignette(GW,GH,0.38);
  drawUI();

  if(state==='gameover'){drawGameOver();drawHomeBtn();}
  if(state==='won'){drawWin();drawHomeBtn();}
  drawMuteBtn();if(PAUSE_CFG.pausable.includes(state))drawPauseBtn();
}

// --- INPUT ---
function screenToWorld(cx,cy){
  const r=canvas.getBoundingClientRect();
  const sx=(cx-r.left)*(GW/r.width);
  const sy=(cy-r.top)*(GH/r.height);
  return{x:sx+camX, y:sy+camY, sx, sy};
}

function screenToCanvas(cx,cy){
  const r=canvas.getBoundingClientRect();
  return{x:(cx-r.left)*(GW/r.width), y:(cy-r.top)*(GH/r.height)};
}

function startGame(){initAudio();init();state='playing';}

function handleSelectClick(canvasX,canvasY){
  const cards=['M1','NEUTRO','M2'];
  const cardW=220, gap=20;
  const totalW=cardW*3+gap*2;
  const startX=(GW-totalW)/2;
  const cardY=65, cardH=310;

  for(let i=0;i<3;i++){
    const cx=startX+i*(cardW+gap);
    if(canvasX>=cx && canvasX<=cx+cardW && canvasY>=cardY && canvasY<=cardY+cardH){
      charType=cards[i];
      state='modeselect';
      return;
    }
  }
}

function handleSelectHover(canvasX,canvasY){
  const cards=['M1','NEUTRO','M2'];
  const cardW=220, gap=20;
  const totalW=cardW*3+gap*2;
  const startX=(GW-totalW)/2;
  const cardY=65, cardH=310;

  selectHover=-1;
  for(let i=0;i<3;i++){
    const cx=startX+i*(cardW+gap);
    if(canvasX>=cx && canvasX<=cx+cardW && canvasY>=cardY && canvasY<=cardY+cardH){
      selectHover=i;
      return;
    }
  }
}

canvas.addEventListener('touchstart',(e)=>{
  e.preventDefault();
  const c=screenToCanvas(e.touches[0].clientX,e.touches[0].clientY);
  if(PAUSE_CFG.pausable.includes(state)&&pauseHit(c.x,c.y)){initAudio();togglePause();return;}
  if(muteHit(c.x,c.y)){initAudio();toggleMute();return;}
  if(state!=='playing' && homeHit(c.x,c.y)){goHome();return;}
  if(state==='menu'){initAudio();state='select';return;}
  if(state==='select'){handleSelectClick(c.x,c.y);return;}
  if(state==='modeselect'){initAudio();pickMode(c.x,c.y);return;}
  if((state==='gameover'||state==='won')&&Date.now()-gameOverTime>600){state='select';return;}
  touching=true;
  const w=screenToWorld(e.touches[0].clientX,e.touches[0].clientY);
  targetX=w.x;targetY=w.y;
},{passive:false});

canvas.addEventListener('touchmove',(e)=>{
  e.preventDefault();
  if(state==='select'){
    const c=screenToCanvas(e.touches[0].clientX,e.touches[0].clientY);
    handleSelectHover(c.x,c.y);
    return;
  }
  if(state!=='playing') return;
  const w=screenToWorld(e.touches[0].clientX,e.touches[0].clientY);
  targetX=w.x;targetY=w.y;
},{passive:false});

canvas.addEventListener('touchend',(e)=>{
  e.preventDefault();
  touching=false;
},{passive:false});

canvas.addEventListener('mousemove',(e)=>{
  const mc=screenToCanvas(e.clientX,e.clientY); mouseX=mc.x; mouseY=mc.y;
  if(state==='select'){
    handleSelectHover(mc.x,mc.y);
    return;
  }
  if(state!=='playing') return;
  const w=screenToWorld(e.clientX,e.clientY);
  targetX=w.x;targetY=w.y;
});

canvas.addEventListener('mousedown',(e)=>{
  if(e.button!==0) return;
  const c=screenToCanvas(e.clientX,e.clientY);
  if(PAUSE_CFG.pausable.includes(state)&&pauseHit(c.x,c.y)){initAudio();togglePause();return;}
  if(muteHit(c.x,c.y)){initAudio();toggleMute();return;}
  if(state!=='playing' && homeHit(c.x,c.y)){goHome();return;}
  if(state==='menu'){initAudio();state='select';return;}
  if(state==='select'){handleSelectClick(c.x,c.y);return;}
  if(state==='modeselect'){initAudio();pickMode(c.x,c.y);return;}
  if((state==='gameover'||state==='won')&&Date.now()-gameOverTime>600){state='select';return;}
});

document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(state==='menu'){initAudio();state='select';return;}
    if(state==='modeselect'){startGame();return;}
    if(state==='gameover'||state==='won'){state='select';return;}
  }
  if(state==='select'){
    if(e.code==='Digit1'||e.code==='Numpad1'){charType='M1';state='modeselect';}
    if(e.code==='Digit2'||e.code==='Numpad2'){charType='NEUTRO';state='modeselect';}
    if(e.code==='Digit3'||e.code==='Numpad3'){charType='M2';state='modeselect';}
  } else if(state==='modeselect'){
    if(e.code==='Digit1'||e.code==='Numpad1'){mode='FACIL';startGame();}
    if(e.code==='Digit2'||e.code==='Numpad2'){mode='MEDIO';startGame();}
    if(e.code==='Digit3'||e.code==='Numpad3'){mode='DIFICIL';startGame();}
    if(e.code==='Escape'){state='select';}
  }
});

// --- LOOP ---
function gameLoop(ts){
  if(lastTS===0) lastTS=ts;
  accum+=ts-lastTS; lastTS=ts;
  if(accum>FT*5) accum=FT*5;
  while(accum>=FT){update();accum-=FT;}
  render();
  requestAnimationFrame(gameLoop);
}

init(); state='menu';
requestAnimationFrame(gameLoop);

const PAUSE_BTN={x:GW-74,y:56,w:28,h:24};
const PAUSE_CFG={pausable:['playing'],
 eyebrow:()=>'JOGO DO FAGÓCITO · '+MODES[mode].label.toUpperCase()+' · PAUSA',
 title:()=>CHAR_CONFIG[charType].name.toUpperCase()+' · '+Math.max(0,Math.ceil((targetFrames-elapsed)/60))+'s RESTANTES',
 lessons:()=>[['OBJETIVO','#66DDAA',(charType==='M2'?'Segure a DEGRADAÇÃO abaixo do máximo até o tempo acabar: repare detritos, necrose e fibrose antes que se espalhem.':'Segure a INFECÇÃO abaixo do máximo até o tempo acabar: as bactérias se multiplicam — fagocite antes que tomem o tecido.')+' Agora: '+Math.round(100*currentLoad()/MODES[mode].maxLoad)+'%.'],
  ['CONTROLES','#FFD34D','A célula segue o mouse (ou o dedo). A cada 10 alvos, a citocina '+CHAR_CONFIG[charType].cytokine+' ativa por 10 segundos. Protozoário te atordoa por 1s.'],
  ['PERIGO','#FF6B6B',LEGENDS[charType][1]],
  ['CONCEITO','#CC88FF',LEGENDS[charType][2]]],
 restart:()=>startGame(), menu:()=>{state='menu';}};

// ===== Pausa com instruções (overlay HTML, estrutura igual à do ImunoTropa) =====
let prevState=null;
function drawPauseBtn(){const b=PAUSE_BTN;ctx.save();ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;ctx.stroke();ctx.font='700 12px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillText('II',b.x+b.w/2,b.y+b.h/2+1);ctx.restore();}
function pauseHit(x,y){const b=PAUSE_BTN;return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}
function showOvl(html){const c=document.getElementById('card');c.innerHTML=html;const o=document.getElementById('ovl');o.classList.remove('hide');o.scrollTop=0;}
function hideOvl(){document.getElementById('ovl').classList.add('hide');}
function pauseHTML(){
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return '<div class="eyebrow">'+esc(PAUSE_CFG.eyebrow())+'</div><h2>'+esc(PAUSE_CFG.title())+'</h2>'
    +PAUSE_CFG.lessons().map(([k,c,t])=>'<div class="lz"><span class="lk" style="color:'+c+'">'+esc(k)+'</span>'+esc(t)+'</div>').join('')
    +'<button class="btn" id="pRs">CONTINUAR</button>'
    +'<button class="btn ghost" id="pRt">REINICIAR</button>'
    +'<button class="btn ghost" id="pMn">SAIR PARA O MENU</button>'
    +'<a class="btn ghost small" id="pHub" href="index.html">VOLTAR AO HUB</a>';
}
function togglePause(){
  if(PAUSE_CFG.pausable.includes(state)){prevState=state;state='paused';showOvl(pauseHTML());
    document.getElementById('pRs').onclick=togglePause;
    document.getElementById('pRt').onclick=()=>{hideOvl();PAUSE_CFG.restart();};
    document.getElementById('pMn').onclick=()=>{hideOvl();PAUSE_CFG.menu();};
    document.getElementById('pRs').focus();
  } else if(state==='paused'){state=prevState;hideOvl();}
}
document.addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(PAUSE_CFG.pausable.includes(state)||state==='paused'){e.preventDefault();togglePause();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&PAUSE_CFG.pausable.includes(state))togglePause();});

</script>
