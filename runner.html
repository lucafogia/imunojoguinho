<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik+Mono+One&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <title>ImmunoRun - Fuga Bacteriana</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a0a2e;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      display: block;
    }
      :root{--ac:#BB66FF;}
    /* ===== Pausa / instruções (overlay no estilo do catálogo immuno.games) ===== */
    #ovl{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(4,7,13,.86);backdrop-filter:blur(5px);padding:12px;overflow-y:auto;font-family:'Orbitron',ui-monospace,Menlo,monospace;color:#eaf6ff;touch-action:pan-y;}
    #ovl.hide{display:none;}
    #ovl .card{width:min(92vw,440px);max-height:94vh;overflow-y:auto;padding:22px 20px;text-align:center;background:linear-gradient(180deg,#0a1122,#070b18);clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);box-shadow:0 0 0 1px #1b2a4d,0 0 34px rgba(0,0,0,.6);}
    #ovl .eyebrow{font-size:9px;letter-spacing:.24em;color:#7b8aa8;margin-bottom:8px;text-transform:uppercase;}
    #ovl h2{margin:0 0 10px;font-size:17px;font-weight:900;letter-spacing:.08em;color:#fff;text-shadow:0 0 12px var(--ac);text-wrap:balance;}
    #ovl .lz{text-align:left;font-size:11.5px;line-height:1.5;color:#c9d6ee;margin:9px 0;font-family:Fredoka,'Segoe UI',Arial,sans-serif;font-weight:500;}
    #ovl .lk{display:block;font-family:'Orbitron',ui-monospace,monospace;font-size:9px;letter-spacing:.18em;margin-bottom:2px;}
    #ovl .btn{display:block;width:100%;margin-top:12px;padding:13px 10px;border:0;cursor:pointer;font-family:inherit;font-weight:900;font-size:12px;letter-spacing:.14em;color:#04070d;background:linear-gradient(90deg,var(--ac),#fff 170%);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);box-shadow:0 0 18px color-mix(in srgb,var(--ac) 55%,transparent);text-decoration:none;box-sizing:border-box;}
    #ovl .btn.ghost{background:transparent;color:#9fb4d8;box-shadow:inset 0 0 0 1px #26365c;font-size:11px;padding:11px;}
    #ovl .btn.small{font-size:9px;padding:9px;margin-top:8px;}
    #ovl .btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px;}
    #ovl .btn:hover{filter:brightness(1.1);}
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ovl" class="hide" role="dialog" aria-modal="true" aria-label="Pausa"><div class="card" id="card"></div></div>
<script>
// ========================================
// IMUNO RUN - Fuga Bacteriana
// ========================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// --- Fixed internal resolution (zoom-proof) ---
const GW = 800;
const GH = 450;
canvas.width = GW;
canvas.height = GH;

function resizeCanvas(){
  const ar=GW/GH,vw=window.innerWidth,vh=window.innerHeight;
  let w,h;
  if(vw/vh>ar){h=vh;w=h*ar;}else{w=vw;h=w/ar;}
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  canvas.style.margin=((vh-h)/2)+'px auto 0';
}
window.addEventListener('resize',resizeCanvas);resizeCanvas();

// --- Fixed game constants ---
const GROUND_Y     = 360;
const PLAYER_W     = 50;
const PLAYER_H     = 35;
const DUCK_H       = 15;
const MACRO_W      = 85;
const MACRO_H      = 55;
const GRAVITY      = 0.52;
const JUMP_FORCE   = -12;
const BASE_SPEED   = 7.5;

// --- Fixed timestep (60fps logic regardless of display Hz) ---
const TARGET_FPS  = 60;
const FRAME_TIME  = 1000 / TARGET_FPS;
let lastTimestamp = 0;
let accumulator   = 0;

// ===== Kit de polimento: fontes, áudio suave, efeitos =====
const FONT='Fredoka, "Segoe UI", Arial, sans-serif', MONO='"Rubik Mono One", "Courier New", monospace';
if(document.fonts){document.fonts.load('700 32px Fredoka');document.fonts.load('400 20px "Rubik Mono One"');}
let muted=localStorage.getItem('imuno_mute')==='1';
let audioCtx=null, masterGain=null;
function initAudio(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const comp=audioCtx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;
    masterGain=audioCtx.createGain();masterGain.gain.value=muted?0:0.7;masterGain.connect(comp);comp.connect(audioCtx.destination);}catch(e){return;}}
  if(audioCtx.state==='suspended')audioCtx.resume();
}
function toggleMute(){muted=!muted;localStorage.setItem('imuno_mute',muted?'1':'0');if(masterGain)masterGain.gain.value=muted?0:0.7;}
// tone(freq, dur s, {type, vol, slide(freq final), attack, cutoff}) — com envelope e filtro, sem estalos
function tone(f,d,o={}){
  if(!audioCtx||!masterGain)return;
  try{const t=audioCtx.currentTime,osc=audioCtx.createOscillator(),g=audioCtx.createGain(),lp=audioCtx.createBiquadFilter();
    osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);if(o.slide)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+d);
    lp.type='lowpass';lp.frequency.value=o.cutoff||2400;
    const v=o.vol||0.05,a=o.attack||0.008;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0005,t+d);
    osc.connect(lp);lp.connect(g);g.connect(masterGain);osc.start(t);osc.stop(t+d+0.02);}catch(e){}
}
function chord(notes,d,o={},gap=0.07){notes.forEach((n,i)=>setTimeout(()=>tone(n,d,o),i*gap*1000));}
function noiseBurst(d,vol=0.05,cutoff=800){
  if(!audioCtx||!masterGain)return;
  try{const t=audioCtx.currentTime,len=Math.floor(audioCtx.sampleRate*d),buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
    const src=audioCtx.createBufferSource(),g=audioCtx.createGain(),lp=audioCtx.createBiquadFilter();src.buffer=buf;lp.type='lowpass';lp.frequency.value=cutoff;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0005,t+d);src.connect(lp);lp.connect(g);g.connect(masterGain);src.start(t);}catch(e){}
}
function vignette(w,h,strength=0.5){const g=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*0.42,w/2,h/2,Math.max(w,h)*0.72);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,'+strength+')');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);}
const MUTE_BTN={x:GW-40,y:GH-34,w:28,h:24};
function drawMuteBtn(){const b=MUTE_BTN;ctx.save();ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,7);ctx.fill();ctx.font='14px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillText(muted?'🔇':'🔊',b.x+b.w/2,b.y+b.h/2+1);ctx.restore();}
function muteHit(x,y){const b=MUTE_BTN;return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}

// --- Sons (suaves, com envelope) ---
function sndJump()     { tone(420,0.14,{slide:760,vol:0.05}); }
function sndHit()      { noiseBurst(0.18,0.08,600); tone(120,0.25,{type:'triangle',slide:60,vol:0.06}); }
function sndSlide()    { noiseBurst(0.12,0.03,1200); }
function sndScore()    { chord([660,880],0.1,{vol:0.03}); }
function sndDodge()    { tone(1200,0.05,{vol:0.02}); }
function sndPowerUp()  { chord([523,659,784,1047],0.18,{vol:0.05}); }
function sndShieldHit(){ tone(500,0.2,{type:'triangle',slide:250,vol:0.05}); }
function sndCount()    { tone(600,0.08,{vol:0.04}); }
function sndGo()       { chord([784,1047],0.2,{vol:0.05}); }
function sndDie()      { tone(300,0.5,{type:'triangle',slide:80,vol:0.06}); noiseBurst(0.4,0.05,400); }
function sndPhago()    { tone(160,0.6,{type:'triangle',slide:50,vol:0.06}); }
function sndWin()      { chord([523,659,784,1047,1319],0.35,{vol:0.05},0.09); }

// --- State ---
let state = 'menu';
let score = 0;
let highScore = parseInt(localStorage.getItem('immunorun_hs') || '0');
let speed = 0;
let frame = 0;
let lastObsFrame = 0;
let shakeTimer = 0;
let flashAlpha = 0;
let gameOverTime = 0;
let countdownVal = 3;
let countdownT = 0;
let dyingT = 0;
let streak = 0;
let bestStreak = 0;

// --- Sessão baseada em tempo + perigo do macrófago ---
let mode = 'MEDIO';
let targetFrames = 5400; // 90s * 60fps; valor real definido no init/seleção de modo
let elapsed = 0;      // frames em 'playing'
let danger = 0;       // 0..1 proximidade do macrófago
let hitPressure = 0;  // contribuição dos toques ao perigo (decai)
let mouseX = 0, mouseY = 0;

let player = {};
let macro = {};
let obstacles = [];
let particles = [];
let dust = [];
let lines = [];
let texts = [];
let bgCells = [];
let bumps = [];
let vessels = [];
let powerUps = [];

// --- Facts ---
const facts = [
  "Macrófagos são células do sistema imune inato que fagocitam patógenos através de pseudópodes.",
  "Anticorpos (imunoglobulinas) são proteínas em forma de Y produzidas por plasmócitos.",
  "O sistema complemento é formado por mais de 30 proteínas que auxiliam na opsonização e lise de patógenos.",
  "Neutrófilos são os leucócitos mais abundantes e os primeiros a chegar no local da infecção.",
  "A fagocitose envolve reconhecimento, englobamento e digestão do patógeno dentro do fagolisossomo.",
  "Citocinas como TNF-α e interleucinas coordenam a comunicação entre células do sistema imune.",
  "Macrófagos são APCs que ativam linfócitos T via MHC classe II.",
  "A resposta inflamatória envolve vasodilatação, aumento de permeabilidade e quimiotaxia de leucócitos.",
  "PAMPs são reconhecidos por receptores como os TLRs dos macrófagos.",
  "Após a fagocitose, o macrófago apresenta peptídeos antigênicos, conectando imunidade inata e adaptativa.",
  "A opsonização marca patógenos com anticorpos ou complemento para facilitar a fagocitose.",
  "Macrófagos M1 são pró-inflamatórios, enquanto M2 participam do reparo tecidual.",
];

const OBS_TYPES = {
  ANTICORPO:   { label:'Anticorpo (IgG)',   color:'#FFD700', dark:'#B8960F', ground:true },
  NEUTROFILO:  { label:'Neutrófilo',        color:'#5599DD', dark:'#336699', ground:true },
  CITOCINA:    { label:'Citocina (TNF-α)',   color:'#FF7744', dark:'#CC4411', ground:false },
  COMPLEMENTO: { label:'Complemento (C3b)', color:'#44DDAA', dark:'#22AA77', ground:true },
};
const obsKeys = Object.keys(OBS_TYPES);

// --- Modos de dificuldade (meta = sobreviver ao tempo) ---
const MODES = {
  FACIL:   {key:'FACIL',   label:'Fácil',   secs:60,  speedMul:0.85, gapMul:1.30, dangerEnd:0.62, hitDanger:0.10, col:'#66DD88'},
  MEDIO:   {key:'MEDIO',   label:'Médio',   secs:90,  speedMul:1.00, gapMul:1.00, dangerEnd:0.74, hitDanger:0.12, col:'#FFC24D'},
  DIFICIL: {key:'DIFICIL', label:'Difícil', secs:120, speedMul:1.20, gapMul:0.80, dangerEnd:0.85, hitDanger:0.15, col:'#FF6B6B'},
};
const modeKeys = ['FACIL','MEDIO','DIFICIL'];

// --- Init ---
function initGame() {
  score = 0; speed = BASE_SPEED; frame = 0; lastObsFrame = -60;
  shakeTimer = 0; flashAlpha = 0; streak = 0; bestStreak = 0;
  elapsed = 0; danger = 0; hitPressure = 0; targetFrames = MODES[mode].secs * 60;
  obstacles = []; particles = []; dust = []; lines = []; texts = []; powerUps = [];

  player = {
    x: 140, y: GROUND_Y - PLAYER_H, w: PLAYER_W, h: PLAYER_H,
    vy: 0, grounded: true, jumping: false,
    ducking: false, duckTimer: 0, duckHold: false, landT: 0,
    wobble: 0, flagella: 0, hitCD: 0,
    shield: 0, shieldPulse: 0,
  };

  macro = {
    x: -120, targetX: -120,
    y: GROUND_Y - MACRO_H * 0.9,
    w: MACRO_W, h: MACRO_H,
    pulse: 0, pseudo: 0,
  };

  bgCells = [];
  for (let i = 0; i < 16; i++)
    bgCells.push({ x: Math.random()*GW*2, y: Math.random()*(GROUND_Y-40)+15,
      r: 18+Math.random()*40, spd: 0.15+Math.random()*0.35, a: 0.04+Math.random()*0.07 });

  vessels = [];
  for (let i = 0; i < 3; i++)
    vessels.push({ x: GW*0.3+Math.random()*GW, y1: Math.random()*GROUND_Y*0.3,
      y2: GROUND_Y*(0.5+Math.random()*0.5), w: 7+Math.random()*10,
      spd: 0.1+Math.random()*0.2, curve: Math.random()*40-20 });

  bumps = [];
  for (let i = 0; i < 45; i++)
    bumps.push({ x: Math.random()*GW*2, r: 2+Math.random()*4 });
}

// --- Spawners ---
function spawnObs() {
  const k = obsKeys[Math.floor(Math.random()*obsKeys.length)];
  const t = OBS_TYPES[k];
  let w, h, y;
  if (t.ground) {
    // Obstáculo de PULO: fica no chão, alto o bastante pra exigir salto.
    w = PLAYER_W * (0.65+Math.random()*0.35);
    h = PLAYER_H * (0.8+Math.random()*0.25);
    y = GROUND_Y - h;
  } else {
    // Obstáculo de ABAIXAR: flutua na altura da cabeça com um vão claro embaixo.
    // Fundo em GROUND_Y-24: passa abaixado (15px) mas colide em pé (35px).
    w = PLAYER_W * (0.7+Math.random()*0.3);
    h = 36;
    y = GROUND_Y - 60;
  }
  obstacles.push({ x:GW+40, y, w, h, type:k, cfg:t, passed:false });
}

function spawnPU() {
  powerUps.push({ x:GW+40, y:GROUND_Y-PLAYER_H*1.8-Math.random()*30,
    w:28, h:28, pulse:0, collected:false });
}

function addParticle(x,y,color,count=8,sp=5) {
  for (let i=0;i<count;i++)
    particles.push({ x,y, vx:(Math.random()-0.5)*sp, vy:(Math.random()-0.8)*sp*0.7,
      life:1, decay:0.015+Math.random()*0.025, r:2+Math.random()*3.5, color });
}

function addDust(x,y) {
  dust.push({ x:x+(Math.random()-0.5)*5, y:y+Math.random()*2,
    vx:-(speed*0.3+Math.random()), vy:-(0.3+Math.random()*0.7),
    life:1, decay:0.03+Math.random()*0.02, r:1.5+Math.random()*2 });
}

function addLine() {
  lines.push({ x:GW+5, y:Math.random()*GROUND_Y, len:15+Math.random()*30+speed*5,
    a:0.08+Math.random()*0.12, spd:speed*(1.5+Math.random()) });
}

function addText(x,y,txt,color='#FFF',size=13) {
  texts.push({ x,y,txt,color,size,life:1,vy:-1.3 });
}

// --- Collision ---
function hit(a,b) {
  const m=5;
  return a.x+m<b.x+b.w-m && a.x+a.w-m>b.x+m && a.y+m<b.y+b.h-m && a.y+a.h-m>b.y+m;
}

// --- UPDATE (1 tick = 1/60s) ---
function update() {
  // Countdown
  if (state==='countdown') {
    countdownT++;
    if (countdownT>=50) {
      countdownT=0; countdownVal--;
      if (countdownVal<=0) { state='playing'; sndGo(); }
      else sndCount();
    }
    player.wobble+=0.1; player.flagella+=0.15;
    macro.pulse+=0.03; macro.pseudo+=0.02;
    return;
  }

  // Dying
  if (state==='dying') {
    dyingT++;
    macro.x += (player.x - macro.w*0.3 - macro.x)*0.08;
    macro.pulse+=0.08; macro.pseudo+=0.06; player.wobble+=0.3;
    if (dyingT%5===0) addParticle(player.x+player.w/2, player.y+player.h/2, '#9955BB',3,3);
    if (dyingT>=80) {
      state='gameover'; gameOverTime=Date.now();
      if (score>highScore) { highScore=score; localStorage.setItem('immunorun_hs',highScore+''); }
      sndDie();
    }
    return;
  }

  if (state!=='playing') return;

  frame++; elapsed++;
  const M = MODES[mode];
  const progress = Math.min(1, elapsed/targetFrames);

  // Velocidade sobe suavemente ao longo da sessão (por modo)
  speed = BASE_SPEED * M.speedMul * (1 + progress*1.0);

  // Score = distância
  if (frame%3===0) { score++; if (score%100===0) sndScore(); }

  // --- Player ---
  player.wobble += 0.15;
  player.flagella += 0.2 + speed*0.015;
  if (player.hitCD > 0) player.hitCD--;
  if (player.landT > 0) player.landT--;
  if (player.shield > 0) { player.shield--; player.shieldPulse+=0.15; }

  if (player.ducking) {
    if (!player.duckHold) {
      player.duckTimer--;
      if (player.duckTimer<=0) {
        player.ducking=false; player.h=PLAYER_H; player.y=GROUND_Y-PLAYER_H;
      }
    }
  }

  if (!player.grounded) {
    player.vy += GRAVITY;
    player.y += player.vy;
    const gl = player.ducking ? GROUND_Y-DUCK_H : GROUND_Y-PLAYER_H;
    if (player.y >= gl) {
      player.y=gl; player.vy=0; player.grounded=true; player.jumping=false; player.landT=8;
      for (let i=0;i<4;i++) addDust(player.x+player.w*0.3, GROUND_Y);
    }
  }

  if (player.grounded && !player.ducking && frame%4===0) addDust(player.x, GROUND_Y);
  if (player.ducking && frame%2===0) { addDust(player.x+player.w*0.4, GROUND_Y); addDust(player.x+player.w*0.2, GROUND_Y); }
  if (frame%3===0) addLine();
  if (speed>BASE_SPEED*1.5 && frame%2===0) addLine();

  // --- Macrófago: fecha o cerco conforme o tempo passa (+ toques) ---
  macro.pulse += 0.05;
  macro.pseudo += 0.03;
  hitPressure = Math.max(0, hitPressure - 0.0006); // pressão dos toques decai devagar
  danger = Math.min(1, M.dangerEnd*progress + hitPressure);
  const catchX = player.x - macro.w*0.55;
  const startX = -120;
  macro.targetX = startX + (catchX - startX)*danger;
  macro.x += (macro.targetX - macro.x) * 0.12;
  macro.y = GROUND_Y - MACRO_H*0.9;

  // Vitória: sobreviveu ao tempo todo
  if (elapsed >= targetFrames) { winRun(); return; }
  // Derrota: o macrófago alcançou a bactéria
  if (danger >= 1 || macro.x + macro.w*0.55 >= player.x) {
    state='dying'; dyingT=0; sndPhago(); return;
  }

  // --- Obstáculos (densidade por modo, aperta com o tempo) ---
  const gap = Math.max(16, (46 - progress*22) * M.gapMul);
  if (frame - lastObsFrame > gap + Math.random()*22) { spawnObs(); lastObsFrame=frame; }

  // Power-ups every ~600 frames after score 50
  if (score>50 && frame%400===0 && player.shield<=0) spawnPU();

  const pHh = player.ducking ? DUCK_H : player.h;
  const pYy = player.ducking ? GROUND_Y-DUCK_H : player.y;
  const pb = { x:player.x, y:pYy, w:player.w, h:pHh };

  for (let i=obstacles.length-1; i>=0; i--) {
    const o = obstacles[i];
    o.x -= speed;

    if (!o.passed && player.hitCD<=0 && hit(pb, o)) {
      if (player.shield>0) {
        o.passed=true; player.shield=0; shakeTimer=5; flashAlpha=0.12;
        addParticle(player.x+player.w/2,pYy+pHh/2,'#44DDFF',14,7);
        sndShieldHit(); addText(player.x,pYy-18,'BIOFILME DESTRUÍDO!','#44DDFF',11);
        streak=0;
      } else {
        o.passed=true; player.hitCD=30;
        hitPressure += M.hitDanger; // tombo aproxima o macrófago
        shakeTimer=12; flashAlpha=0.3;
        addParticle(player.x+player.w/2,pYy+pHh/2,'#FF4444',14,7);
        sndHit(); streak=0; addText(player.x,pYy-12,'OUCH!','#FF6666',15);
      }
    }

    if (!o.passed && o.x+o.w < player.x) {
      o.passed=true; streak++;
      hitPressure = Math.max(0, hitPressure - 0.008); // desvio limpo alivia a pressão
      if (streak>bestStreak) bestStreak=streak;
      addParticle(o.x+o.w/2, o.y+o.h/2, o.cfg.color, 3);
      sndDodge();
      if (streak>=10 && streak%5===0) addText(player.x+player.w,pYy-22,streak+'x COMBO!','#FFD700',16);
      else if (streak===5) addText(player.x+player.w,pYy-18,'5x COMBO!','#FFAA00',14);
    }

    if (o.x+o.w < -40) obstacles.splice(i,1);
  }

  // Power-ups
  for (let i=powerUps.length-1; i>=0; i--) {
    const p = powerUps[i]; p.x -= speed; p.pulse+=0.1;
    if (!p.collected && hit(pb, p)) {
      p.collected=true; player.shield=300; player.shieldPulse=0;
      addParticle(p.x+p.w/2,p.y+p.h/2,'#44FFDD',18,9);
      sndPowerUp(); addText(p.x,p.y-18,'BIOFILME ATIVADO!','#44FFDD',13);
    }
    if (p.x+p.w < -40) powerUps.splice(i,1);
  }

  // BG scroll
  for (const c of bgCells) { c.x-=speed*c.spd; if(c.x+c.r<0){c.x=GW+c.r+Math.random()*200; c.y=Math.random()*(GROUND_Y-40)+15;} }
  for (const v of vessels) { v.x-=speed*v.spd; if(v.x<-40){v.x=GW+40+Math.random()*200; v.curve=Math.random()*40-20;} }
  for (const b of bumps)   { b.x-=speed; if(b.x<-10) b.x=GW+Math.random()*200; }

  // Particles
  for (let i=particles.length-1;i>=0;i--) { const p=particles[i]; p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=p.decay; if(p.life<=0)particles.splice(i,1); }
  for (let i=dust.length-1;i>=0;i--)      { const d=dust[i]; d.x+=d.vx;d.y+=d.vy;d.life-=d.decay; if(d.life<=0)dust.splice(i,1); }
  for (let i=lines.length-1;i>=0;i--)     { lines[i].x-=lines[i].spd; if(lines[i].x+lines[i].len<0)lines.splice(i,1); }
  for (let i=texts.length-1;i>=0;i--)     { const t=texts[i]; t.y+=t.vy;t.life-=0.015; if(t.life<=0)texts.splice(i,1); }

  if (shakeTimer>0) shakeTimer--;
  if (flashAlpha>0) flashAlpha-=0.012;
}

function drawBG() {
  const g = ctx.createLinearGradient(0,0,0,GROUND_Y);
  g.addColorStop(0,'#1E0E36'); g.addColorStop(0.35,'#3A1852');
  g.addColorStop(0.65,'#5C2D6B'); g.addColorStop(1,'#7A4060');
  ctx.fillStyle=g; ctx.fillRect(0,0,GW,GROUND_Y);
  // O céu esquenta conforme o perigo cresce
  if(state==='playing'&&danger>0.2){const dg2=ctx.createLinearGradient(0,0,0,GROUND_Y);dg2.addColorStop(0,`rgba(255,40,80,${(danger-0.2)*0.3})`);dg2.addColorStop(1,'rgba(255,40,80,0)');ctx.fillStyle=dg2;ctx.fillRect(0,0,GW,GROUND_Y);}

  // Vessels
  for (const v of vessels) {
    ctx.beginPath(); ctx.moveTo(v.x,v.y1);
    ctx.quadraticCurveTo(v.x+v.curve,(v.y1+v.y2)/2,v.x-v.curve*0.5,v.y2);
    ctx.strokeStyle='rgba(180,50,70,0.1)'; ctx.lineWidth=v.w; ctx.lineCap='round'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(v.x,v.y1);
    ctx.quadraticCurveTo(v.x+v.curve,(v.y1+v.y2)/2,v.x-v.curve*0.5,v.y2);
    ctx.strokeStyle='rgba(220,80,100,0.05)'; ctx.lineWidth=v.w*0.5; ctx.stroke();
  }

  for (const c of bgCells) { // células de fundo com volume suave
    const cg=ctx.createRadialGradient(c.x-c.r*0.25,c.y-c.r*0.25,c.r*0.1,c.x,c.y,c.r);
    cg.addColorStop(0,`rgba(255,210,225,${c.a*1.7})`);cg.addColorStop(0.7,`rgba(255,150,190,${c.a})`);cg.addColorStop(1,'rgba(255,150,190,0)');
    ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.fillStyle=cg; ctx.fill();
    ctx.beginPath(); ctx.arc(c.x-c.r*0.1,c.y-c.r*0.1,c.r*0.3,0,Math.PI*2); ctx.fillStyle=`rgba(255,120,170,${c.a*0.9})`; ctx.fill();
  }

  // Speed lines
  for (const s of lines) {
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x+s.len,s.y);
    ctx.strokeStyle=`rgba(255,200,255,${s.a})`; ctx.lineWidth=1; ctx.stroke();
  }

  // Ground
  const gg = ctx.createLinearGradient(0,GROUND_Y,0,GH);
  gg.addColorStop(0,'#C4596A'); gg.addColorStop(0.1,'#B44D5E');
  gg.addColorStop(0.5,'#943D4E'); gg.addColorStop(1,'#6B2A3A');
  ctx.fillStyle=gg; ctx.fillRect(0,GROUND_Y,GW,GH-GROUND_Y);

  ctx.strokeStyle='rgba(255,160,180,0.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(GW,GROUND_Y); ctx.stroke();

  for (const b of bumps) {
    ctx.beginPath(); ctx.arc(b.x,GROUND_Y+5+b.r,b.r,0,Math.PI*2);
    ctx.fillStyle='rgba(140,50,65,0.2)'; ctx.fill();
  }
  // brilho úmido na superfície do tecido
  const gl=ctx.createLinearGradient(0,GROUND_Y,0,GROUND_Y+20);gl.addColorStop(0,'rgba(255,225,235,0.4)');gl.addColorStop(1,'rgba(255,225,235,0)');ctx.fillStyle=gl;ctx.fillRect(0,GROUND_Y,GW,20);
}

function drawDust() {
  for (const d of dust) {
    ctx.globalAlpha=d.life*0.45;
    ctx.beginPath(); ctx.arc(d.x,d.y,d.r*d.life,0,Math.PI*2);
    ctx.fillStyle='#D4A0A0'; ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawBact() {
  const px=player.x, pw=player.w;
  const py=player.ducking?GROUND_Y-DUCK_H:player.y;
  const ph=player.ducking?DUCK_H:player.h;
  let sc=1;
  if (state==='dying') { sc=1-Math.min(1,dyingT/80)*0.85; if(sc<0.1)return; }
  if (player.hitCD>0 && Math.floor(player.hitCD/3)%2===0) return;

  ctx.save();
  const wx=Math.sin(player.wobble)*1.5, wy=Math.cos(player.wobble*0.7);
  ctx.translate(px+pw/2+wx, py+ph/2+wy);
  if (sc!==1) ctx.scale(sc,sc);
  // squash & stretch: estica no ar, achata ao pousar
  let ssx=1, ssy=1;
  if(!player.grounded){const v=Math.max(-1,Math.min(1,player.vy/12));ssx=1-Math.abs(v)*0.12;ssy=1+Math.abs(v)*0.18;}
  else if(player.landT>0){const t=player.landT/8;ssx=1+t*0.22;ssy=1-t*0.22;}
  ctx.scale(ssx,ssy);
  ctx.shadowColor=player.shield>0?'rgba(68,255,221,0.9)':'rgba(120,255,120,0.75)';ctx.shadowBlur=16;

  // Shield
  if (player.shield>0) {
    const sr=Math.max(pw,ph)*0.75+Math.sin(player.shieldPulse)*2.5;
    const sa=player.shield<60?(Math.sin(player.shieldPulse*3)*0.3+0.3):0.25;
    ctx.beginPath(); ctx.arc(0,0,sr,0,Math.PI*2);
    ctx.strokeStyle=`rgba(68,255,221,${sa})`; ctx.lineWidth=2.5; ctx.stroke();
    ctx.fillStyle=`rgba(68,255,221,${sa*0.12})`; ctx.fill();
    for (let i=0;i<6;i++) {
      const a=(i/6)*Math.PI*2+player.shieldPulse*0.5;
      ctx.beginPath(); ctx.arc(Math.cos(a)*sr*0.85,Math.sin(a)*sr*0.85,1.8,0,Math.PI*2);
      ctx.fillStyle=`rgba(68,255,221,${sa*0.4})`; ctx.fill();
    }
  }

  // Flagella
  const shd = player.shield>0;
  ctx.strokeStyle=shd?'#55DDAA':'#55AA55'; ctx.lineWidth=2.5;
  ctx.beginPath();
  for (let i=0;i<20;i++) {
    const t=i/19, fx=-pw/2-t*pw*0.85, fy=Math.sin(player.flagella+t*4.5)*(4+t*7);
    if(i===0) ctx.moveTo(fx,fy); else ctx.lineTo(fx,fy);
  }
  ctx.stroke();

  // Pili
  ctx.strokeStyle=shd?'rgba(68,221,170,0.4)':'rgba(85,170,85,0.4)'; ctx.lineWidth=1;
  for (let i=0;i<5;i++) {
    const a=(i/5)*Math.PI+Math.PI*0.5+player.wobble*0.2;
    const bx=Math.cos(a)*pw*0.42, by=Math.sin(a)*ph*0.42;
    ctx.beginPath(); ctx.moveTo(bx,by);
    ctx.lineTo(bx+Math.cos(a)*7, by+Math.sin(a)*7+Math.sin(player.wobble+i)*2);
    ctx.stroke();
  }

  // Body
  ctx.beginPath(); ctx.ellipse(0,0,pw/2,ph/2,0,0,Math.PI*2);
  const bg=ctx.createRadialGradient(-pw*0.1,-ph*0.1,0,0,0,pw/2);
  if(shd){bg.addColorStop(0,'#88EEDD');bg.addColorStop(0.7,'#55CCAA');bg.addColorStop(1,'#339977');}
  else   {bg.addColorStop(0,'#99EE99');bg.addColorStop(0.7,'#55BB55');bg.addColorStop(1,'#338833');}
  ctx.fillStyle=bg; ctx.fill();
  ctx.strokeStyle=shd?'#228866':'#337733'; ctx.lineWidth=1.5; ctx.stroke();

  // Membrane dots
  for (let i=0;i<8;i++) {
    const a=(i/8)*Math.PI*2+player.wobble*0.3;
    ctx.beginPath(); ctx.arc(Math.cos(a)*pw*0.37,Math.sin(a)*ph*0.37,1.6,0,Math.PI*2);
    ctx.fillStyle=shd?'#449977':'#448844'; ctx.fill();
  }

  // Eyes
  ctx.shadowBlur=0;
  const ey=-ph*0.12, es=pw*0.15;
  const danger=Math.max(0,macro.x+macro.w*0.55)/player.x;
  [[-es,ey],[es,ey]].forEach(([x,y])=>{ ctx.beginPath();ctx.ellipse(x,y,4,5,0,0,Math.PI*2);ctx.fillStyle='white';ctx.fill(); });
  const lb=danger>0.4?-1.5:1.5;
  [[-es+lb,ey+0.5],[es+lb,ey+0.5]].forEach(([x,y])=>{ ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fillStyle='#111';ctx.fill(); });

  if (danger>0.6) {
    ctx.beginPath(); ctx.ellipse(0,ph*0.15,4.5,3.5,0,0,Math.PI*2);
    ctx.fillStyle='#226622'; ctx.fill();
    const sp=player.wobble*2;
    ctx.beginPath(); ctx.ellipse(pw*0.33,-ph*0.28+Math.sin(sp)*2,1.8,3,0.3,0,Math.PI*2);
    ctx.fillStyle='rgba(100,200,255,0.7)'; ctx.fill();
    ctx.strokeStyle='#337733'; ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-es-3,ey-7);ctx.lineTo(-es+3,ey-5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(es+3,ey-7);ctx.lineTo(es-3,ey-5);ctx.stroke();
  } else if (danger>0.3) {
    ctx.beginPath(); ctx.arc(0,ph*0.18,4.5,0.2,Math.PI-0.2);
    ctx.strokeStyle='#337733'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(pw*0.33,-ph*0.22,1.5,2.5,0.3,0,Math.PI*2);
    ctx.fillStyle='rgba(100,200,255,0.5)'; ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0,ph*0.08,4,0.1,Math.PI-0.1);
    ctx.strokeStyle='#337733'; ctx.lineWidth=1.5; ctx.stroke();
  }

  ctx.restore();
}

function drawMacro() {
  const mx=macro.x, my=macro.y, mw=macro.w, mh=macro.h;
  const p=Math.sin(macro.pulse)*3;
  let es=1; if(state==='dying') es=1+Math.min(1,dyingT/80)*0.3;

  ctx.save();
  ctx.translate(mx+mw/2, my+mh/2);
  if(es!==1) ctx.scale(es,es);

  const dangerL=Math.max(0,mx+mw*0.55)/(player.x||1);
  if(dangerL>0.15){ // aura ameaçadora aditiva que cresce com a proximidade
    ctx.save();ctx.globalCompositeOperation='lighter';
    const ar=mw*0.9+dangerL*30+p*3;
    const ag=ctx.createRadialGradient(0,0,mw*0.3,0,0,ar);
    ag.addColorStop(0,`rgba(255,60,120,${dangerL*0.25})`);ag.addColorStop(1,'rgba(255,60,120,0)');
    ctx.beginPath();ctx.arc(0,0,ar,0,Math.PI*2);ctx.fillStyle=ag;ctx.fill();ctx.restore(); }
  ctx.shadowColor='rgba(170,90,230,0.85)';ctx.shadowBlur=18;

  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2+macro.pseudo;
    const l=mw*0.36+Math.sin(macro.pseudo*2+i*1.3)*8;
    ctx.beginPath();ctx.ellipse(Math.cos(a)*l,Math.sin(a)*l,8+p,6+p,a,0,Math.PI*2);
    ctx.fillStyle='#7744AA';ctx.fill();
  }

  ctx.beginPath(); ctx.ellipse(0,0,mw/2+p,mh/2+p*0.5,0,0,Math.PI*2);
  const mg=ctx.createRadialGradient(-4,-4,0,0,0,mw/2+4);
  mg.addColorStop(0,'#CC88EE');mg.addColorStop(0.5,'#9955CC');mg.addColorStop(1,'#6633AA');
  ctx.fillStyle=mg;ctx.fill();ctx.strokeStyle='#553399';ctx.lineWidth=2;ctx.stroke();

  ctx.beginPath();ctx.ellipse(-2,2,mw*0.16,mh*0.2,0.4,0,Math.PI*2);
  ctx.fillStyle='rgba(40,15,70,0.4)';ctx.fill();

  for(let i=0;i<4;i++){
    const lx=Math.cos(i*1.8+macro.pulse*0.5)*mw*0.18;
    const ly=Math.sin(i*1.8+macro.pulse*0.5)*mh*0.18;
    ctx.beginPath();ctx.arc(lx,ly,2.5,0,Math.PI*2);ctx.fillStyle='rgba(200,100,50,0.35)';ctx.fill();
  }

  ctx.shadowBlur=0;
  const e2=-mh*0.12;
  ctx.beginPath();ctx.arc(-8,e2,5.5,0,Math.PI*2);ctx.fillStyle='#FFF0F0';ctx.fill();
  ctx.beginPath();ctx.arc(-6.5,e2+1,2.8,0,Math.PI*2);ctx.fillStyle='#990000';ctx.fill();
  ctx.beginPath();ctx.arc(8,e2,5.5,0,Math.PI*2);ctx.fillStyle='#FFF0F0';ctx.fill();
  ctx.beginPath();ctx.arc(9.5,e2+1,2.8,0,Math.PI*2);ctx.fillStyle='#990000';ctx.fill();
  ctx.strokeStyle='#553399';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(-14,e2-7);ctx.lineTo(-3,e2-3.5);ctx.stroke();
  ctx.beginPath();ctx.moveTo(14,e2-7);ctx.lineTo(3,e2-3.5);ctx.stroke();

  if(state==='dying'){
    ctx.beginPath();ctx.arc(0,mh*0.14,8,0.1,Math.PI-0.1);
    ctx.fillStyle='#330055';ctx.fill();ctx.strokeStyle='#440066';ctx.lineWidth=1.5;ctx.stroke();
  } else {
    ctx.beginPath();ctx.arc(0,mh*0.14,6.5,0.2,Math.PI-0.2);
    ctx.strokeStyle='#440066';ctx.lineWidth=2;ctx.stroke();
  }

  ctx.restore();
}

function drawObs(o) {
  ctx.save();
  ctx.translate(o.x+o.w/2, o.y+o.h/2);
  const c = o.cfg;
  ctx.shadowColor=c.color;ctx.shadowBlur=14;

  if(o.type==='ANTICORPO'){
    ctx.strokeStyle=c.color; ctx.lineWidth=3.5; ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(0,o.h*0.4);ctx.lineTo(0,-o.h*0.05);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-o.h*0.05);ctx.quadraticCurveTo(-o.w*0.15,-o.h*0.2,-o.w*0.4,-o.h*0.4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-o.h*0.05);ctx.quadraticCurveTo(o.w*0.15,-o.h*0.2,o.w*0.4,-o.h*0.4);ctx.stroke();
    ctx.fillStyle='#FFEE66';
    [[-o.w*0.4,-o.h*0.4],[o.w*0.4,-o.h*0.4]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,4.5,0,Math.PI*2);ctx.fill();});
    ctx.fillStyle=c.color;ctx.beginPath();ctx.arc(0,o.h*0.4,4,0,Math.PI*2);ctx.fill();
  } else if(o.type==='NEUTROFILO'){
    const nr=Math.min(o.w,o.h)*0.42;
    ctx.beginPath();ctx.arc(0,0,nr,0,Math.PI*2);
    const ng=ctx.createRadialGradient(-2,-2,0,0,0,nr);
    ng.addColorStop(0,'#AADDFF');ng.addColorStop(0.6,'#6699CC');ng.addColorStop(1,c.dark);
    ctx.fillStyle=ng;ctx.fill();ctx.strokeStyle=c.dark;ctx.lineWidth=1.5;ctx.stroke();
    const lr=nr*0.27;
    ctx.fillStyle='rgba(25,50,100,0.5)';
    [[-lr*0.8,-lr*0.3],[0,lr*0.5],[lr*0.8,-lr*0.5]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,lr,0,Math.PI*2);ctx.fill();});
  } else if(o.type==='CITOCINA'){
    const cr=Math.min(o.w,o.h)*0.28;
    ctx.beginPath();ctx.arc(0,0,cr*2,0,Math.PI*2);ctx.fillStyle='rgba(255,119,68,0.08)';ctx.fill();
    ctx.beginPath();ctx.arc(0,0,cr,0,Math.PI*2);
    const cg=ctx.createRadialGradient(-1,-1,0,0,0,cr);
    cg.addColorStop(0,'#FFCC99');cg.addColorStop(0.5,'#FF9955');cg.addColorStop(1,c.dark);
    ctx.fillStyle=cg;ctx.fill();ctx.strokeStyle=c.dark;ctx.lineWidth=1.5;ctx.stroke();
    for(let i=1;i<=3;i++){
      const wr=cr+i*6+Math.sin(frame*0.08+i)*2.5;
      ctx.strokeStyle=`rgba(255,119,68,${0.3-i*0.08})`;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(0,0,wr,-0.5,0.5);ctx.stroke();
      ctx.beginPath();ctx.arc(0,0,wr,Math.PI-0.4,Math.PI+0.4);ctx.stroke();
    }
  } else if(o.type==='COMPLEMENTO'){
    const cr2=Math.min(o.w,o.h)*0.13;
    const pos=[[0,0],[-7,-6],[7,-4],[-4,7],[8,5],[-7,2],[3,-8]];
    pos.forEach(([x,y],i)=>{
      ctx.beginPath();ctx.arc(x,y,cr2-i*0.2,0,Math.PI*2);
      const cg2=ctx.createRadialGradient(x-1,y-1,0,x,y,cr2);
      cg2.addColorStop(0,'#88FFCC');cg2.addColorStop(1,c.dark);
      ctx.fillStyle=cg2;ctx.fill();ctx.strokeStyle=c.dark;ctx.lineWidth=0.8;ctx.stroke();
    });
    ctx.strokeStyle='rgba(34,170,119,0.25)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(pos[0][0],pos[0][1]);
    for(let i=1;i<pos.length;i++) ctx.lineTo(pos[i][0],pos[i][1]);
    ctx.stroke();
  }

  // Label (pílula)
  ctx.shadowBlur=0;
  ctx.font='600 9px '+FONT; ctx.textAlign='center';
  const lw=ctx.measureText(c.label).width+12;
  ctx.fillStyle='rgba(20,8,30,0.6)';ctx.beginPath();ctx.roundRect(-lw/2,-o.h/2-17,lw,14,7);ctx.fill();
  ctx.fillStyle='#FFF'; ctx.fillText(c.label,0,-o.h/2-6);

  // Seta-guia (didática): chevron verde = PULE (acima) / amarelo = ABAIXE (no vão)
  if(o.x > player.x-20 && o.x < GW*0.85){
    ctx.globalAlpha=0.9; ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round';
    if(o.cfg.ground){
      const ay=-o.h/2-15; ctx.strokeStyle='#8CFF8C';
      ctx.beginPath(); ctx.moveTo(-6,ay+5); ctx.lineTo(0,ay-4); ctx.lineTo(6,ay+5); ctx.stroke();
    } else {
      const ay=o.h/2+13; ctx.strokeStyle='#FFD34D';
      ctx.beginPath(); ctx.moveTo(-6,ay-5); ctx.lineTo(0,ay+4); ctx.lineTo(6,ay-5); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  ctx.restore();
}

function drawPU(pu) {
  if(pu.collected) return;
  ctx.save();
  ctx.translate(pu.x+pu.w/2, pu.y+pu.h/2+Math.sin(pu.pulse)*3);
  ctx.shadowColor='#44FFDD';ctx.shadowBlur=18;

  const gr=pu.w*0.7+Math.sin(pu.pulse*1.5)*2;
  ctx.beginPath();ctx.arc(0,0,gr,0,Math.PI*2);ctx.fillStyle='rgba(68,255,221,0.12)';ctx.fill();

  ctx.beginPath();
  for(let i=0;i<6;i++){const a=(i/6)*Math.PI*2-Math.PI/2;const x=Math.cos(a)*pu.w*0.4,y=Math.sin(a)*pu.w*0.4;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
  ctx.closePath();
  const pg=ctx.createRadialGradient(0,0,0,0,0,pu.w*0.4);
  pg.addColorStop(0,'#88FFEE');pg.addColorStop(1,'#33CCAA');
  ctx.fillStyle=pg;ctx.fill();ctx.strokeStyle='#22AA88';ctx.lineWidth=1.5;ctx.stroke();

  ctx.font='bold 12px Fredoka,Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#116655';ctx.fillText('B',0,1);

  ctx.font='bold 8px Fredoka,Arial,sans-serif';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#44FFDD';ctx.fillText('Biofilme',0,-pu.h/2-7);

  ctx.restore();
}

function drawParts() {
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of particles){ctx.globalAlpha=p.life;ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();}
  ctx.restore();ctx.globalAlpha=1;
}

function drawTexts() {
  for(const t of texts){
    ctx.globalAlpha=t.life;
    const s=t.size*(1+(1-t.life)*0.3);
    ctx.font=`bold ${s}px Fredoka,Arial,sans-serif`;ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillText(t.txt,t.x+1,t.y+1);
    ctx.fillStyle=t.color;ctx.fillText(t.txt,t.x,t.y);
  }
  ctx.globalAlpha=1;
}

function drawUI() {
  // Score (pílula)
  ctx.font="400 17px "+MONO; ctx.textAlign='right';
  const sw0=ctx.measureText(score+'m').width+22;
  ctx.fillStyle='rgba(20,8,30,0.55)';ctx.beginPath();ctx.roundRect(GW-15-sw0,12,sw0,28,10);ctx.fill();
  ctx.fillStyle='#FFF'; ctx.fillText(score+'m',GW-25,32);

  // Tempo restante (meta de sobrevivência)
  const remain = Math.max(0, Math.ceil((targetFrames - elapsed)/60));
  ctx.fillStyle='rgba(20,8,30,0.55)';ctx.beginPath();ctx.roundRect(GW/2-42,8,84,40,12);ctx.fill();
  ctx.font="400 22px "+MONO; ctx.textAlign='center';
  ctx.fillStyle= remain<=10 ? '#FF7777' : '#FFF'; ctx.fillText(remain+'s', GW/2, 30);
  ctx.font='500 9px '+FONT; ctx.fillStyle='rgba(255,255,255,0.6)';
  ctx.fillText('resta', GW/2, 42);
  ctx.textAlign='right';

  if(streak>=3){ctx.font='bold 12px Fredoka,Arial,sans-serif';ctx.fillStyle=streak>=10?'#FFD700':'#FFAA44';ctx.fillText(streak+'x',GW-15,47);}

  // Shield bar
  if(player.shield>0){
    const sw=100,sh=5,sx=GW-15-sw,sy=streak>=3?55:50;
    const pct=player.shield/300;
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(sx,sy,sw,sh);
    ctx.fillStyle=pct>0.3?'#44FFDD':'#FFAA44';ctx.fillRect(sx,sy,sw*pct,sh);
    ctx.font='9px Fredoka,Arial,sans-serif';ctx.fillStyle='#44FFDD';ctx.fillText('BIOFILME',sx+sw,sy+sh+10);
  }

  // Danger bar
  const bw=180,bh=12,bx=15,by=15;
  const dp=Math.min(1,Math.max(0,danger));

  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,bh/2);ctx.fill();
  ctx.save();
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,bh/2);ctx.clip();
  const dg=ctx.createLinearGradient(bx,0,bx+bw,0);
  dg.addColorStop(0,'#44FF88');dg.addColorStop(0.4,'#FFEE44');dg.addColorStop(0.7,'#FF8844');dg.addColorStop(1,'#FF2222');
  ctx.fillStyle=dg;ctx.fillRect(bx,by,bw*dp,bh);
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,bh/2);ctx.stroke();

  ctx.font='bold 10px Fredoka,Arial,sans-serif';ctx.textAlign='left';
  ctx.fillStyle=dp>0.7?'#FF6666':'rgba(255,255,255,0.6)';
  ctx.fillText('PERIGO',bx,by+bh+12);

  // Edge vignette
  if(dp>0.4){
    const va=(dp-0.4)*0.5*(0.7+Math.sin(frame*0.1)*0.3);
    const eg=ctx.createLinearGradient(0,0,GW*0.12,0);
    eg.addColorStop(0,`rgba(200,30,30,${va})`);eg.addColorStop(1,'rgba(200,30,30,0)');
    ctx.fillStyle=eg;ctx.fillRect(0,0,GW*0.12,GH);
  }

  if(flashAlpha>0){ctx.fillStyle=`rgba(255,50,50,${flashAlpha})`;ctx.fillRect(0,0,GW,GH);}
}

function drawCountdown() {
  const prog=countdownT/50;
  ctx.fillStyle=`rgba(20,10,40,${0.45-prog*0.25})`;ctx.fillRect(0,0,GW,GH);

  ctx.save();
  ctx.translate(GW/2,GH*0.4);
  const sc=1+(1-prog)*0.4;
  ctx.scale(sc,sc); ctx.globalAlpha=1-prog*0.3;
  ctx.font='bold 72px Fredoka,Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor='#AA55FF';ctx.shadowBlur=25;
  ctx.fillStyle='#FFF';ctx.fillText(countdownVal>0?countdownVal+'':'FUJA!',0,0);
  ctx.shadowBlur=0;
  ctx.restore();ctx.globalAlpha=1;
}

function wrapTextR(text,maxW){
  const ws=text.split(' ');let lines=[],cur='';
  for(const w of ws){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;
}

// --- RENDER ---
function render() {
  ctx.clearRect(0,0,GW,GH);
  if(state==='menu'){drawMenu();drawHomeBtn();drawMuteBtn();return;}
  if(state==='modeselect'){drawModeSelect();drawHomeBtn();drawMuteBtn();return;}

  ctx.save();
  if(shakeTimer>0){const i=shakeTimer*1.2;ctx.translate((Math.random()-0.5)*i,(Math.random()-0.5)*i);}

  drawBG(); drawDust();
  for(const p of powerUps) drawPU(p);
  for(const o of obstacles) drawObs(o);
  drawMacro(); drawBact(); drawParts(); drawTexts();

  ctx.restore();
  vignette(GW,GH,0.45);

  if(state==='playing'||state==='dying') drawUI();
  if(state==='countdown'){drawUI();drawCountdown();}
  if(state==='gameover'){drawGameOver();drawHomeBtn();}
  if(state==='won'){drawWin();drawHomeBtn();}
  drawMuteBtn();if(PAUSE_CFG.pausable.includes(state))drawPauseBtn();
}

// --- ACTIONS ---
function startGame() { initAudio(); initGame(); state='countdown'; countdownVal=3; countdownT=0; sndCount(); }
function startWithMode(key){ mode=key; targetFrames=MODES[key].secs*60; startGame(); }
function winRun(){
  state='won'; gameOverTime=Date.now();
  if (score>highScore){ highScore=score; localStorage.setItem('immunorun_hs',highScore+''); }
  sndWin();
}
function canvasXY(cx,cy){ const r=canvas.getBoundingClientRect(); return { x:(cx-r.left)*(GW/r.width), y:(cy-r.top)*(GH/r.height) }; }
function modeButtonRects(){
  const bw=200,bh=76,gap=22,total=3*bw+2*gap,x0=(GW-total)/2,y=GH*0.60;
  return modeKeys.map((k,i)=>({key:k,x:x0+i*(bw+gap),y,w:bw,h:bh}));
}
function pickMode(x,y){ for(const r of modeButtonRects()){ if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){ startWithMode(r.key); return; } } }
// Botão "voltar ao hub" (telas fora do jogo)
const HOME_BTN={x:12,y:12,w:82,h:26};
const HOME_STATES=['menu','modeselect','gameover','won'];
function drawHomeBtn(){
  const b=HOME_BTN;
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,7);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,7);ctx.stroke();
  ctx.font='bold 11px Fredoka,Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(255,255,255,0.8)';ctx.fillText('⌂  Menu',b.x+b.w/2,b.y+b.h/2+1);
  ctx.textBaseline='alphabetic';
}
function homeHit(x,y){const b=HOME_BTN;return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}
function goHome(){location.href='index.html';}

function doJump() {
  if(state!=='playing'||!player.grounded||player.ducking) return;
  player.vy=JUMP_FORCE; player.grounded=false; player.jumping=true;
  sndJump();
  for(let i=0;i<3;i++) addDust(player.x+player.w*0.3,GROUND_Y);
}

function doDuck(hold) {
  if(state!=='playing'||!player.grounded||player.ducking) return;
  player.ducking=true; player.duckTimer=25; player.duckHold=!!hold;
  player.h=DUCK_H; player.y=GROUND_Y-DUCK_H;
  sndSlide();
}
function stopDuck() {
  player.duckHold=false;
  if(player.ducking && player.grounded){
    player.ducking=false; player.h=PLAYER_H; player.y=GROUND_Y-PLAYER_H;
  }
}

  e.preventDefault();
  touchSY=e.touches[0].clientY; touchST=Date.now();
  const p=canvasXY(e.touches[0].clientX,e.touches[0].clientY);
  if(PAUSE_CFG.pausable.includes(state)&&pauseHit(p.x,p.y)){initAudio();togglePause();return;}
  if(muteHit(p.x,p.y)){initAudio();toggleMute();return;}
  if(HOME_STATES.includes(state)&&homeHit(p.x,p.y)){goHome();return;}
  if(state==='menu'){initAudio();state='modeselect';return;}
  if(state==='modeselect'){initAudio();pickMode(p.x,p.y);return;}
  if((state==='gameover'||state==='won')&&Date.now()-gameOverTime>600){state='modeselect';return;}
},{passive:false});

canvas.addEventListener('touchmove',(e)=>{e.preventDefault();},{passive:false});

canvas.addEventListener('touchend',(e)=>{
  e.preventDefault();
  if(state!=='playing') return;
  const dy=e.changedTouches[0].clientY-touchSY;
  const dt=Date.now()-touchST;
  if(dy>30&&dt<300) doDuck(); else doJump();
},{passive:false});

document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    e.preventDefault();
    if(state==='menu'){initAudio();state='modeselect';return;}
    if(state==='modeselect'){startWithMode(mode);return;}
    if(state==='gameover'||state==='won'){state='modeselect';return;}
    doJump();
  }
  if(e.code==='ArrowDown'||e.code==='KeyS'){e.preventDefault();doDuck(true);}
  if(state==='modeselect'){
    if(e.code==='Digit1'||e.code==='Numpad1') startWithMode('FACIL');
    if(e.code==='Digit2'||e.code==='Numpad2') startWithMode('MEDIO');
    if(e.code==='Digit3'||e.code==='Numpad3') startWithMode('DIFICIL');
  }
});
document.addEventListener('keyup',(e)=>{
  if(e.code==='ArrowDown'||e.code==='KeyS') stopDuck();
});

canvas.addEventListener('mousedown',(e)=>{
  if(e.button!==0)return;
  const p=canvasXY(e.clientX,e.clientY);
  if(PAUSE_CFG.pausable.includes(state)&&pauseHit(p.x,p.y)){initAudio();togglePause();return;}
  if(muteHit(p.x,p.y)){initAudio();toggleMute();return;}
  if(HOME_STATES.includes(state)&&homeHit(p.x,p.y)){goHome();return;}
  if(state==='menu'){initAudio();state='modeselect';return;}
  if(state==='modeselect'){initAudio();pickMode(p.x,p.y);return;}
  if(state==='gameover'||state==='won'){ if(Date.now()-gameOverTime>400) state='modeselect'; return; }
  doJump();
});
canvas.addEventListener('mousemove',(e)=>{ const p=canvasXY(e.clientX,e.clientY); mouseX=p.x; mouseY=p.y; });
canvas.addEventListener('contextmenu',(e)=>{e.preventDefault();doDuck();});

// --- MAIN LOOP (fixed timestep) ---
function gameLoop(timestamp) {
  if(lastTimestamp===0) lastTimestamp=timestamp;
  accumulator += timestamp - lastTimestamp;
  lastTimestamp = timestamp;
  if(accumulator > FRAME_TIME*5) accumulator = FRAME_TIME*5; // prevent spiral

  while(accumulator >= FRAME_TIME) {
    update();
    accumulator -= FRAME_TIME;
  }

  render();
  requestAnimationFrame(gameLoop);
}

initGame();
state='menu';
requestAnimationFrame(gameLoop);

const PAUSE_BTN={x:GW-74,y:GH-34,w:28,h:24};
const PAUSE_CFG={pausable:['playing','countdown'],
 eyebrow:()=>'IMUNO RUN · '+MODES[mode].label.toUpperCase()+' · PAUSA',
 title:()=>'FUGA BACTERIANA · '+Math.max(0,Math.ceil((targetFrames-elapsed)/60))+'s RESTANTES',
 lessons:()=>[['OBJETIVO','#8CFF8C','Sobreviva '+MODES[mode].secs+'s sem ser fagocitado. A barra de PERIGO mostra o quanto o macrófago se aproximou: sobe com o tempo, salta a cada tombo e alivia a cada desvio limpo.'],
  ['CONTROLES','#FFD34D','Espaço / ↑ / W pula · ↓ / S (segure) abaixa · no celular: toque pula, deslize para baixo abaixa.'],
  ['LEGENDA','#37F0FF','Seta VERDE ^ = pule por cima (anticorpo, neutrófilo, complemento). Seta AMARELA ⌄ = abaixe (citocina flutuando). Biofilme = escudo por alguns segundos.'],
  ['CONCEITO','#FF7BFF','Anticorpos opsonizam, o complemento marca e as citocinas recrutam: o macrófago fagocita o que foi sinalizado. Escapar do sistema imune é difícil por desenho.']],
 restart:()=>startWithMode(mode), menu:()=>{state='menu';}};

// ===== Pausa com instruções (overlay HTML, estrutura igual à do ImunoTropa) =====
let prevState=null;
function drawPauseBtn(){const b=PAUSE_BTN;ctx.save();ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,7);ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;ctx.stroke();ctx.font='700 12px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fillText('II',b.x+b.w/2,b.y+b.h/2+1);ctx.restore();}
function pauseHit(x,y){const b=PAUSE_BTN;return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}
function showOvl(html){const c=document.getElementById('card');c.innerHTML=html;const o=document.getElementById('ovl');o.classList.remove('hide');o.scrollTop=0;}
function hideOvl(){document.getElementById('ovl').classList.add('hide');}
function pauseHTML(){
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return '<div class="eyebrow">'+esc(PAUSE_CFG.eyebrow())+'</div><h2>'+esc(PAUSE_CFG.title())+'</h2>'
    +PAUSE_CFG.lessons().map(([k,c,t])=>'<div class="lz"><span class="lk" style="color:'+c+'">'+esc(k)+'</span>'+esc(t)+'</div>').join('')
    +'<button class="btn" id="pRs">CONTINUAR</button>'
    +'<button class="btn ghost" id="pRt">REINICIAR</button>'
    +'<button class="btn ghost" id="pMn">SAIR PARA O MENU</button>'
    +'<a class="btn ghost small" id="pHub" href="index.html">VOLTAR AO HUB</a>';
}
function togglePause(){
  if(PAUSE_CFG.pausable.includes(state)){prevState=state;state='paused';showOvl(pauseHTML());
    document.getElementById('pRs').onclick=togglePause;
    document.getElementById('pRt').onclick=()=>{hideOvl();PAUSE_CFG.restart();};
    document.getElementById('pMn').onclick=()=>{hideOvl();PAUSE_CFG.menu();};
    document.getElementById('pRs').focus();
  } else if(state==='paused'){state=prevState;hideOvl();}
}
document.addEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){if(PAUSE_CFG.pausable.includes(state)||state==='paused'){e.preventDefault();togglePause();}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&PAUSE_CFG.pausable.includes(state))togglePause();});

</script>
